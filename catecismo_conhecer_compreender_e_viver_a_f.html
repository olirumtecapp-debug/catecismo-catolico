    <!-- JavaScript Data & Logic Providers -->
    <script>
        /* ==========================================
           1. DATA PROVIDERS DEFINITION
           ========================================== */
        const LiturgicalContentProvider = {
            /* ---- Calendário litúrgico calculado (algoritmo de Meeus/Jones/Butcher para a Páscoa) ---- */
            _easter(year) {
                const a = year % 19, b = Math.floor(year / 100), c = year % 100;
                const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
                const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
                const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
                const m = Math.floor((a + 11 * h + 22 * l) / 451);
                const month = Math.floor((h + l - 7 * m + 114) / 31);
                const day = ((h + l - 7 * m + 114) % 31) + 1;
                return new Date(year, month - 1, day);
            },
            _addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; },
            _fmt(date) { return date.toISOString().split('T')[0]; },
            _weekdayPt(date) {
                return ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][date.getDay()];
            },

            /** Retorna a estrutura litúrgica de qualquer data (tempo, cor, celebração). */
            getDayInfo(dateStr = new Date().toISOString().split('T')[0]) {
                const date = new Date(dateStr + 'T12:00:00');
                const year = date.getFullYear();
                const easter = this._easter(year);
                const ashWednesday = this._addDays(easter, -46);
                const pentecost = this._addDays(easter, 49);
                const christmas = new Date(year, 11, 25);
                // Advento: 4º domingo antes do Natal
                const advent4 = this._addDays(christmas, -(christmas.getDay() === 0 ? 7 : christmas.getDay()) - 21);
                const epiphany = new Date(year, 0, 6);
                const baptism = this._addDays(epiphany, epiphany.getDay() === 0 ? 7 : (7 - epiphany.getDay()) + 7);

                const diffEaster = Math.round((date - easter) / 86400000);
                const weekday = this._weekdayPt(date);
                const isSunday = date.getDay() === 0;

                let season, color, celebration, rank;
                if (date >= advent4 && date < christmas) {
                    season = 'Advento'; color = 'Roxo';
                    const week = Math.min(4, Math.floor((date - advent4) / 604800000) + 1);
                    celebration = `${weekday} da ${week}ª Semana do Advento`; rank = isSunday ? 'Domingo' : 'Féria';
                } else if (date >= christmas && date <= baptism) {
                    season = 'Tempo do Natal'; color = 'Branco';
                    celebration = date.getTime() === christmas.getTime() ? 'Natal do Senhor' :
                        date.getTime() === new Date(year,0,1).getTime() ? 'Santa Maria, Mãe de Deus (Solene)' :
                        date.getTime() === epiphany.getTime() ? 'Epifania do Senhor (Solene)' :
                        date.getTime() === baptism.getTime() ? 'Batismo do Senhor (Festa)' : `${weekday} do Tempo do Natal`;
                    rank = 'Festa';
                } else if (date >= ashWednesday && date < easter) {
                    season = 'Quaresma'; color = 'Roxo';
                    const week = Math.min(5, Math.floor((date - ashWednesday) / 604800000) + 1);
                    celebration = date.getTime() === ashWednesday.getTime() ? 'Quarta-feira de Cinzas' :
                        diffEaster === -7 ? 'Domingo de Ramos' :
                        diffEaster === -3 ? 'Quinta-feira Santa' :
                        diffEaster === -2 ? 'Sexta-feira Santa (Paixão)' :
                        diffEaster === -1 ? 'Sábado Santo' : `${weekday} da ${week}ª Semana da Quaresma`;
                    rank = diffEaster >= -7 ? 'Solene' : isSunday ? 'Domingo' : 'Féria';
                    if (diffEaster === -2 || diffEaster === -1) color = diffEaster === -2 ? 'Vermelho' : 'Roxo';
                } else if (date >= easter && date <= pentecost) {
                    season = 'Tempo Pascal'; color = diffEaster === 49 ? 'Vermelho' : 'Branco';
                    const week = Math.min(7, Math.floor(diffEaster / 7) + 1);
                    celebration = diffEaster === 0 ? 'Páscoa — Ressurreição do Senhor (Solene)' :
                        diffEaster === 39 ? 'Ascensão do Senhor (Solene)' :
                        diffEaster === 49 ? 'Pentecostes (Solene)' :
                        isSunday ? `${week}º Domingo da Páscoa` : `${weekday} da ${week}ª Semana da Páscoa`;
                    rank = diffEaster === 0 || diffEaster === 39 || diffEaster === 49 ? 'Solene' : isSunday ? 'Domingo' : 'Féria';
                } else {
                    season = 'Tempo Comum'; color = 'Verde';
                    // Semana do Tempo Comum: semanas após Pentecostes ou após Batismo do Senhor
                    const start = date > pentecost ? pentecost : baptism;
                    const week = Math.max(1, Math.floor((date - start) / 604800000) + (date > pentecost ? 1 : 1));
                    celebration = isSunday ? `${week}º Domingo do Tempo Comum` : `${weekday} da ${week}ª Semana do Tempo Comum`;
                    rank = isSunday ? 'Domingo' : 'Féria';
                    // Festas fixas do Tempo Comum
                    const md = `${date.getMonth()+1}-${date.getDate()}`;
                    const fixed = { '6-29':['São Pedro e São Paulo, Apóstolos (Solene)','Vermelho'], '8-15':['Assunção de Nossa Senhora (Solene)','Branco'], '11-1':['Todos os Santos (Solene)','Branco'], '12-8':['Imaculada Conceição (Solene)','Branco'], '3-19':['São José (Solene)','Branco'], '3-25':['Anunciação do Senhor (Solene)','Branco'], '9-14':['Exaltação da Santa Cruz (Festa)','Vermelho'], '10-4':['São Francisco de Assis (Memória)','Branco'], '12-25':['Natal do Senhor (Solene)','Branco'] };
                    if (fixed[md]) { celebration = fixed[md][0]; color = fixed[md][1]; rank = 'Solene/Festa'; }
                }
                return { date: dateStr, weekday, liturgicalSeason: season, celebration, rank, liturgicalColor: color };
            },

            /* ---- Leituras cadastradas (demonstrativo CNBB) ---- */
            _readings: {
                "2026-09-09": {
                    saintOrMemory: "São Pedro Claver, Sacerdote (Memória facultativa)",
                    firstReading: { reference: "Colossenses 3,1-11", text: "Irmãos, já que ressuscitastes com Cristo, buscai as coisas do alto, onde Cristo está sentado à direita de Deus. Afeiçoai-vos às coisas do alto e não às da terra. Pois morrestes e a vossa vida está escondida com Cristo em Deus. Quando Cristo, a vossa vida, se manifestar, então também vós vos manifestareis com ele na glória. Mortificai, pois, os vossos membros no que têm de terreno: a fornicação, a impureza, as paixões, os maus desejos e a avareza, que é uma idolatria." },
                    psalm: { reference: "Sl 144(145),10-11.12-13ab", text: "R. A bondade do Senhor é para todos. Que todas as vossas obras, ó Senhor, vos glorifiquem, e os vossos fiéis vos bendigam! Proclamem a glória do vosso reino e anunciem o vosso poder." },
                    gospel: { reference: "Lucas 6,20-26", text: "Naquele tempo, Jesus, levantando os olhos para os seus discípulos, disse: 'Bem-aventurados vós, os pobres, porque vosso é o Reino de Deus! Bem-aventurados vós, que agora tendes fome, porque sereis saciados! Bem-aventurados vós, que agora chorais, porque haveis de rir! Bem-aventurados sereis quando os homens vos odiarem, vos expulsarem, vos insultarem e amaldiçoarem o vosso nome, por causa do Filho do Homem! Alegrai-vos, nesse dia, e exultai, pois será grande a vossa recompensa no céu.'" },
                    reflection: "As bem-aventuranças proclamadas por Cristo invertem a lógica mundana. A verdadeira riqueza do discípulo consiste em depositar toda a confiança na Providência divina e abraçar a mansidão evangélica.",
                    prayer: "Senhor Deus, que destes a São Pedro Claver um amor admirável para servir aos escravos, concedei-nos buscar a Cristo nos irmãos e servi-lo de coração. Amém."
                },
                "2026-09-10": {
                    saintOrMemory: "São Nicolau de Tolentino",
                    firstReading: { reference: "Colossenses 3,12-17", text: "Revesti-vos, pois, como eleitos de Deus, santos e amados, de entranhada misericórdia, de bondade, humildade, doçura, paciência. Suportai-vos uns aos outros e perdoai-vos mutuamente, se algum tiver queixa contra outro. Como o Senhor vos perdoou, assim também vós perdoai. Acima de tudo, revesti-vos da caridade, que é o vínculo da perfeição." },
                    psalm: { reference: "Sl 150,1-2.3-4.5-6", text: "R. Tudo o que tem vida louve ao Senhor! Louvai a Deus no seu santuário, louvai-o no seu firmamento poderoso! Louvai-o pelos seus feitos grandiosos, louvai-o pela sua imensa majestade!" },
                    gospel: { reference: "Lucas 6,27-38", text: "A vós outros que ouvis, eu digo: Amai os vossos inimigos, fazei o bem aos que vos odeiam, abençoai os que vos maldicem, orai pelos que vos caluniam. Ao que te bate numa face, oferece-lhe também a outra. Não julgueis e não sereis julgados; não condeneis e não sereis condenados; perdoai e sereis perdoados." },
                    reflection: "O amor cristão desafia o ressentimento humano. Ao perdoar e abençoar, participamos da própria perfeição do Pai celeste que faz nascer o sol sobre bons e maus.",
                    prayer: "Ó Deus, que nos dais a graça do perdão, dai-nos coragem para amar sem medidas e construir a paz. Amém."
                },
                "2026-09-11": {
                    saintOrMemory: "Sexta-feira da 23ª Semana do Tempo Comum",
                    firstReading: { reference: "1 Coríntios 9,16-19.22b-27", text: "Anunciar o Evangelho não é para mim motivo de glória, é antes uma necessidade que se me impõe. Ai de mim se eu não evangelizar! Faço-me tudo para todos, para salvar alguns a todo o custo. Todos correm no estádio, mas um só recebe o prêmio. Correi de tal modo que o alcanceis." },
                    psalm: { reference: "Sl 83(84),3-6.12", text: "R. Quão amáveis são as vossas moradas, Senhor! Minha alma suspira e desfalece pelos átrios do Senhor. Felizes os que habitam a vossa casa!" },
                    gospel: { reference: "Lucas 6,39-42", text: "Pode um cego guiar outro cego? Não cairão os dois num buraco? Por que vês o argueiro no olho do teu irmão e não percebes a trave que há no teu próprio olho? Hipócrita! Tira primeiro a trave do teu olho, e então verás claramente para tirar o argueiro do olho do teu irmão." },
                    reflection: "Antes de corrigir o mundo, o discípulo é chamado à conversão do próprio olhar. A humildade é a lente que purifica a visão espiritual.",
                    prayer: "Senhor, purificai o meu coração para que eu veja os irmãos com os vossos olhos de misericórdia. Amém."
                },
                "2026-09-12": {
                    saintOrMemory: "Santíssimo Nome de Maria (Memória facultativa)",
                    firstReading: { reference: "1 Coríntios 10,14-22", text: "O cálice de bênção que abençoamos não é comunhão com o sangue de Cristo? E o pão que partimos não é comunhão com o corpo de Cristo? Porque há um só pão, nós, embora muitos, somos um só corpo, pois todos participamos do único pão." },
                    psalm: { reference: "Sl 115(116),12-13.17-18", text: "R. A vós oferecerei um sacrifício de louvor. Como retribuirei ao Senhor por tudo o que ele me deu? Elevarei o cálice da salvação, invocando o nome do Senhor." },
                    gospel: { reference: "Lucas 6,43-49", text: "Não há árvore boa que dê frutos maus, nem árvore má que dê frutos bons. O homem bom tira do bom tesouro do seu coração o bem. Por que me chamais: Senhor! Senhor! e não fazeis o que eu digo? Quem ouve as minhas palavras e as põe em prática é como o homem que construiu a casa sobre a rocha." },
                    reflection: "A fé autêntica prova-se na prática. Construir sobre a rocha é unir a escuta da Palavra à obediência concreta da vida diária.",
                    prayer: "Senhor Jesus, fazei que minha vida seja edificada sobre a rocha da vossa Palavra. Amém."
                },
                "2026-09-13": {
                    saintOrMemory: "24º Domingo do Tempo Comum",
                    firstReading: { reference: "Êxodo 32,7-11.13-14", text: "O Senhor disse a Moisés: 'Vi este povo: é um povo de dura cerviz. Agora, deixa-me, para que se acenda contra eles a minha ira e eu os extermine.' Mas Moisés suplicou ao Senhor, e o Senhor arrependeu-se do mal que ameaçara fazer ao seu povo." },
                    psalm: { reference: "Sl 50(51),3-4.12-13.17.19", text: "R. Eu me levantarei e irei ter com meu pai. Tende piedade de mim, ó Deus, segundo a vossa misericórdia. Criai em mim um coração puro, ó Deus." },
                    gospel: { reference: "Lucas 15,1-32", text: "Os publicanos e pecadores aproximavam-se de Jesus para o escutar. Então ele lhes propôs esta parábola: 'Qual de vós, tendo cem ovelhas e perdendo uma, não deixa as noventa e nove no deserto e vai procurar a que se perdeu até encontrá-la? Haverá mais alegria no céu por um só pecador que se converte do que por noventa e nove justos que não precisam de conversão.' E contou a parábola do filho pródigo: 'Este meu filho estava morto e tornou a viver; estava perdido e foi encontrado.'" },
                    reflection: "O coração de Deus é o do pastor que busca e do pai que espera. Nenhum pecador está longe demais para a misericórdia que sai ao encontro.",
                    prayer: "Pai misericordioso, acolhei-me como acolhestes o filho pródigo, e fazei-me instrumento do vosso perdão. Amém."
                },
                "2026-09-14": {
                    saintOrMemory: "Exaltação da Santa Cruz (Festa)",
                    firstReading: { reference: "Números 21,4b-9", text: "O povo murmurou contra Deus e contra Moisés. O Senhor enviou serpentes venenosas. Moisés fez uma serpente de bronze e colocou-a sobre um poste: todo aquele que, mordido, olhava para ela, ficava curado." },
                    psalm: { reference: "Sl 77(78),1-2.34-38", text: "R. Não esqueçais as obras do Senhor. Escuta, meu povo, a minha lei; presta ouvidos às palavras da minha boca." },
                    gospel: { reference: "João 3,13-17", text: "Ninguém subiu ao céu, a não ser aquele que desceu do céu, o Filho do Homem. Como Moisés levantou a serpente no deserto, assim é necessário que o Filho do Homem seja levantado, para que todo aquele que nele crer tenha a vida eterna. Deus amou tanto o mundo, que deu o seu Filho único, para que todo o que nele crer não pereça, mas tenha a vida eterna." },
                    reflection: "A cruz, instrumento de condenação, torna-se árvore da vida. Contemplar o Crucificado é olhar para a medida do amor de Deus pela humanidade.",
                    prayer: "Nós vos adoramos, ó Cristo, e vos bendizemos, porque pela vossa santa cruz remistes o mundo. Amém."
                },
                "2026-09-15": {
                    saintOrMemory: "Nossa Senhora das Dores (Memória)",
                    firstReading: { reference: "1 Coríntios 12,12-14.27-31a", text: "Como o corpo é um e tem muitos membros, e todos os membros do corpo, embora muitos, formam um só corpo, assim também é Cristo. Vós sois o corpo de Cristo e cada um é membro por sua parte. Aspirai aos dons mais elevados." },
                    psalm: { reference: "Sl 99(100),1-5", text: "R. Somos o povo do Senhor, o rebanho que ele conduz. Aclamai ao Senhor, ó terra inteira, servi ao Senhor com alegria!" },
                    gospel: { reference: "João 19,25-27", text: "Junto à cruz de Jesus estavam de pé sua mãe e a irmã de sua mãe. Jesus, vendo sua mãe e ao lado dela o discípulo que amava, disse à mãe: 'Mulher, eis aí o teu filho.' Depois disse ao discípulo: 'Eis aí a tua mãe.' E daquela hora em diante, o discípulo a recebeu em sua casa." },
                    reflection: "Maria permanece de pé junto à cruz: modelo de fé que não foge do sofrimento. Em sua dor, ela recebe a humanidade como filho.",
                    prayer: "Mãe das Dores, ensinai-nos a permanecer fiéis junto à cruz de Cristo e a acolher os irmãos como filhos. Amém."
                }
            },

            /** Leituras genéricas por tempo litúrgico, quando a data não tem leituras cadastradas. */
            _genericBySeason: {
                'Advento': {
                    firstReading: { reference: "Isaías 40,3-5", text: "Uma voz clama: 'Preparai no deserto o caminho do Senhor, aplanai na estepe uma estrada para o nosso Deus. Todo vale será aterrado, toda montanha e colina serão rebaixadas. Então a glória do Senhor se manifestará, e toda carne a verá.'" },
                    psalm: { reference: "Sl 24(25),4-5.8-9", text: "R. Mostrai-me, Senhor, os vossos caminhos. Fazei-me conhecer as vossas veredas e ensinai-me as vossas sendas. O Senhor é bom e reto, indica o caminho aos pecadores." },
                    gospel: { reference: "Marcos 1,1-8", text: "Início do Evangelho de Jesus Cristo, Filho de Deus. João Batista apareceu no deserto, proclamando um batismo de conversão para a remissão dos pecados: 'Depois de mim virá aquele que é mais forte do que eu. Eu vos batizo na água; ele vos batizará no Espírito Santo.'" },
                    reflection: "O Advento é tempo de vigiar e preparar os caminhos do coração. Aplanar os vales e rebaixar as colinas é endireitar, pela conversão, tudo o que nos afasta de Deus.",
                    prayer: "Senhor, despertai os nossos corações para preparar a vossa vinda. Vinde, Senhor Jesus! Amém."
                },
                'Tempo do Natal': {
                    firstReading: { reference: "Isaías 9,1-6", text: "O povo que andava nas trevas viu uma grande luz. Um menino nos nasceu, um filho nos foi dado. Ele se chamará: Conselheiro Admirável, Deus Forte, Pai Eterno, Príncipe da Paz." },
                    psalm: { reference: "Sl 95(96),1-3.11-13", text: "R. Hoje nos nasceu o Salvador. Cantai ao Senhor um cântico novo, cantai ao Senhor, terra inteira! Anunciai entre as nações a sua glória." },
                    gospel: { reference: "Lucas 2,1-14", text: "Naqueles dias, saiu um decreto de César Augusto. José subiu da Galileia a Belém com Maria, sua esposa, que estava grávida. Ela deu à luz o seu filho primogênito, envolveu-o em faixas e deitou-o numa manjedoura. O anjo disse aos pastores: 'Hoje vos nasceu, na cidade de Davi, o Salvador, que é o Cristo Senhor. Glória a Deus nas alturas e paz na terra aos homens por ele amados.'" },
                    reflection: "Deus se faz pequeno para que o possamos acolher. A manjedoura ensina que a grandeza divina se revela na humildade e no amor simples.",
                    prayer: "Senhor Jesus, nascido por nós, nascei hoje em nossos corações e fazei-nos portadores da vossa paz. Amém."
                },
                'Quaresma': {
                    firstReading: { reference: "Joel 2,12-18", text: "Agora, oráculo do Senhor: voltai para mim com todo o vosso coração, com jejum, lágrimas e gemidos. Rasgai os vossos corações, e não as vossas vestes, e voltai para o Senhor, vosso Deus, porque ele é benigno e misericordioso, lento para a cólera e rico em amor." },
                    psalm: { reference: "Sl 50(51),3-6.12-14", text: "R. Tende piedade, Senhor, pois pecamos. Tende piedade de mim, ó Deus, segundo a vossa misericórdia; apagai a minha iniquidade. Criai em mim um coração puro, ó Deus." },
                    gospel: { reference: "Mateus 6,1-6.16-18", text: "Guardai-vos de praticar a vossa justiça diante dos homens para serdes vistos por eles. Quando deres esmola, que a tua mão esquerda não saiba o que faz a direita. Quando orardes, entra no teu quarto, fecha a porta e ora a teu Pai em segredo. Quando jejuardes, perfuma a tua cabeça e lava o teu rosto, para que o teu jejum seja conhecido do teu Pai que está no oculto." },
                    reflection: "A Quaresma chama à conversão do coração, não à aparência. Esmola, oração e jejum são caminhos de volta ao Pai quando feitos na verdade e no segredo.",
                    prayer: "Senhor, dai-nos corações novos e sinceros neste tempo de graça e conversão. Amém."
                },
                'Tempo Pascal': {
                    firstReading: { reference: "Atos 10,34a.37-43", text: "Pedro tomou a palavra: 'Vós conheceis o que aconteceu em toda a Judeia: Jesus de Nazaré, ungido por Deus com o Espírito Santo, passou fazendo o bem e curando os oprimidos. Deus o ressuscitou ao terceiro dia e concedeu-lhe manifestar-se àqueles que foram escolhidos como testemunhas, que comeram e beberam com ele depois que ressuscitou dos mortos.'" },
                    psalm: { reference: "Sl 117(118),1-2.16-17.22-23", text: "R. Este é o dia que o Senhor fez: exultemos de alegria! Celebrai o Senhor, porque ele é bom, porque a sua misericórdia é eterna. A pedra que os construtores rejeitaram tornou-se a pedra angular." },
                    gospel: { reference: "João 20,1-9", text: "No primeiro dia da semana, Maria Madalena foi ao sepulcro de madrugada e viu a pedra retirada. Pedro e o outro discípulo correram ao sepulcro. O discípulo amado chegou primeiro, viu os panos de linho no chão e o sudário dobrado à parte. Ele viu e creu: era preciso que Jesus ressuscitasse dos mortos." },
                    reflection: "O sepulcro vazio é o fundamento da nossa esperança. A ressurreição não é memória do passado, mas presença viva que transforma o hoje do discípulo.",
                    prayer: "Senhor ressuscitado, fazei-nos testemunhas da vossa vida nova. Aleluia! Amém."
                },
                'Tempo Comum': {
                    firstReading: { reference: "Deuteronômio 6,4-9", text: "Ouve, Israel: o Senhor nosso Deus é o único Senhor. Amarás o Senhor teu Deus com todo o teu coração, com toda a tua alma e com todas as tuas forças. Estas palavras que hoje te ordeno estarão no teu coração: repeti-las-ás a teus filhos, falarás delas em casa e no caminho, ao deitar e ao levantar." },
                    psalm: { reference: "Sl 18(19),8-10", text: "R. Senhor, tu tens palavras de vida eterna. A lei do Senhor é perfeita, conforta a alma; o testemunho do Senhor é fiel, dá sabedoria aos simples. Os preceitos do Senhor são retos, alegram o coração." },
                    gospel: { reference: "Mateus 22,34-40", text: "Perguntaram a Jesus: 'Mestre, qual é o maior mandamento da Lei?' Jesus respondeu: 'Amarás o Senhor teu Deus com todo o teu coração, com toda a tua alma e com todo o teu entendimento. Este é o maior e o primeiro mandamento. O segundo é semelhante: Amarás o teu próximo como a ti mesmo. Toda a Lei e os Profetas dependem destes dois mandamentos.'" },
                    reflection: "No Tempo Comum, a Igreja percorre o ensino de Jesus para a vida cotidiana. Tudo se resume no amor: a Deus por inteiro, ao próximo como a si mesmo.",
                    prayer: "Senhor, ensinai-nos a amar-vos de todo o coração e a servir-vos nos irmãos de cada dia. Amém."
                }
            },

            getLiturgicalDay(dateStr = new Date().toISOString().split('T')[0]) {
                const info = this.getDayInfo(dateStr);
                const readings = this._readings[dateStr];
                const generic = this._genericBySeason[info.liturgicalSeason];
                return {
                    source: readings ? "Leituras do dia (CNBB / demonstrativo)" : `Leituras meditativas do ${info.liturgicalSeason} (seleção da plataforma)`,
                    ...info,
                    saintOrMemory: readings?.saintOrMemory || info.celebration,
                    firstReading: readings?.firstReading || generic.firstReading,
                    psalm: readings?.psalm || generic.psalm,
                    gospel: readings?.gospel || generic.gospel,
                    reflection: readings?.reflection || generic.reflection,
                    prayer: readings?.prayer || generic.prayer,
                };
            }
        };

            modules: [
                // CREIO (5 Aulas)
                { id: "creio_1", categoryId: "creio", title: "1. O desejo de Deus", ccc: "CCC § 27-30", description: "O homem traz inscrito no coração a ânsia pelo Criador.", explanation: "O desejo de Deus está inscrito no coração do homem, porque o homem foi criado por Deus e para Deus. Deus não cessa de atrair o homem a Si e só em Deus o homem encontrará a verdade e a felicidade que procura.", keyPoints: ["O homem traz a ânsia por Deus no íntimo.", "Deus atrai continuamente a criatura.", "A felicidade plena só se encontra no Criador."], reflection: "Em que momentos percebo que as coisas passageiras não preenchem meu coração?", questions: [{ q: "Por que o homem busca instintivamente a Deus?", a: "Porque foi criado por Ele e para Ele." }], quizQuestions: [{ q: "Onde está inscrito o desejo de Deus?", options: ["No coração do homem", "Nas pedras", "Nos astros"], correct: 0 }] },
                { id: "creio_2", categoryId: "creio", title: "2. A Revelação Divina", ccc: "CCC § 50-53", description: "Deus revela-Se a Si mesmo e manifesta o mistério da sua vontade.", explanation: "Apraz a Deus, na sua bondade e sabedoria, revelar-Se a Si mesmo e dar a conhecer o mistério da sua vontade: os homens, por meio de Cristo, Verbo feito carne, têm acesso ao Pai no Espírito Santo.", keyPoints: ["Deus toma a iniciativa de se revelar.", "A revelação atinge o cume em Jesus Cristo.", "Somos chamados à comunhão trinitária."], reflection: "Como acolho a Palavra de Deus em minha vida diária?", questions: [{ q: "Quem é a plenitude da Revelação?", a: "Jesus Cristo." }], quizQuestions: [{ q: "Qual é a plenitude da Revelação divina?", options: ["Jesus Cristo", "Os profetas", "A natureza"], correct: 0 }] },
                { id: "creio_3", categoryId: "creio", title: "3. A Fé: resposta do homem a Deus", ccc: "CCC § 142-143", description: "Pela fé, o homem submete plenamente sua inteligência e sua vontade a Deus.", explanation: "A fé é a resposta adequada do homem a Deus, que se revela. Significa entregar-se inteiramente a Ele, reconhecendo Sua verdade absoluta e confiando em Suas promessas, modelo que vemos perfeitamente em Abraão e na Virgem Maria.", keyPoints: ["A fé é um dom gratuito e uma virtude sobrenatural.", "Exige o assentimento da inteligência e da vontade.", "A fé sem obras é morta."], reflection: "Minha fé se traduz em confiança diária na providência de Deus?", questions: [{ q: "O que significa crer?", a: "Submeter livremente a inteligência e a vontade a Deus." }], quizQuestions: [{ q: "A fé cristã exige o consentimento de quê?", options: ["Inteligência e vontade", "Apenas das emoções", "Da cultura popular"], correct: 0 }] },
                { id: "creio_4", categoryId: "creio", title: "4. A Sagrada Escritura e a Tradição", ccc: "CCC § 80-84", description: "A transmissão da Revelação divina através da Igreja.", explanation: "A Sagrada Tradição e a Sagrada Escritura estão intimamente unidas e compenetradas entre si. Ambas dimanam da mesma fonte divina, formam um só tesouro da Palavra de Deus e são confiadas à Igreja para a salvação da humanidade.", keyPoints: ["Bíblia e Tradição formam um único depósito da fé.", "O Magistério tem a tarefa de interpretar autenticamente a Palavra.", "A Revelação encerrou-se com os apóstolos."], reflection: "Eu procuro ler a Bíblia junto com a sabedoria bimilenar da Igreja?", questions: [{ q: "Quais são os dois canais de transmissão da Revelação?", a: "A Sagrada Escritura e a Sagrada Tradição." }], quizQuestions: [{ q: "O que forma o único depósito da fé?", options: ["Sagrada Escritura e Sagrada Tradição", "Bíblia e a Ciência", "Opiniões teológicas"], correct: 0 }] },
                { id: "creio_5", categoryId: "creio", title: "5. A Santíssima Trindade", ccc: "CCC § 232-234", description: "O mistério central da fé e da vida cristã.", explanation: "O mistério da Santíssima Trindade é o mistério central da fé e da vida cristã. É o mistério de Deus em Si mesmo. Os cristãos são batizados em nome do Pai e do Filho e do Espírito Santo: não em seus nomes, pois há um só Deus, o Pai Todo-Poderoso e seu Filho Único e o Espírito Santo.", keyPoints: ["Existe um só Deus em três Pessoas divinas.", "As três Pessoas são consubstanciais (possuem a mesma natureza divina).", "Toda a obra da salvação é obra comum das três Pessoas."], reflection: "Reconheço que ao fazer o Sinal da Cruz invoco a presença real do Deus Trino?", questions: [{ q: "O que é o mistério da Santíssima Trindade?", a: "É o mistério de um só Deus em três Pessoas divinas." }], quizQuestions: [{ q: "Quantos deuses os cristãos adoram?", options: ["Um só Deus", "Três Deuses", "Muitos deuses"], correct: 0 }] },

                // CELEBRO (5 Aulas)
                { id: "celebro_1", categoryId: "celebro", title: "1. O que é a Liturgia", ccc: "CCC § 1066-1070", description: "A participação do Povo de Deus na obra de Deus.", explanation: "A Liturgia é o culto público oficial que a Igreja rende a Deus. Por meio da Liturgia, Cristo, nosso Redentor e Sumo Sacerdote, continua na Sua Igreja, com ela e por ela, a obra da nossa redenção.", keyPoints: ["É a obra de Cristo Sacerdote e do Seu Corpo, a Igreja.", "Na Liturgia celebra-se o mistério pascal de Cristo.", "É a fonte e o ápice da vida cristã."], reflection: "Participo da Liturgia como mero espectador ou ativamente como membro do Corpo de Cristo?", questions: [{ q: "O que é a Liturgia na Igreja Católica?", a: "O culto público que o Corpo Místico de Cristo (Cabeça e membros) presta a Deus." }], quizQuestions: [{ q: "A Liturgia é ação de quem?", options: ["De Cristo total (Cabeça e membros)", "Apenas do Sacerdote", "Do coral da Igreja"], correct: 0 }] },
                { id: "celebro_2", categoryId: "celebro", title: "2. O Mistério Pascal", ccc: "CCC § 1084-1085", description: "A paixão, morte, ressurreição e glorificação de Jesus.", explanation: "O centro da liturgia é o mistério pascal: a paixão, morte, ressurreição e ascensão de Cristo, pela qual Ele destruiu nossa morte e restaurou a vida. Através dos sacramentos da Igreja, Cristo nos comunica as graças deste mistério redentor.", keyPoints: ["O mistério pascal é um evento real que não fica no passado.", "A liturgia torna presente a eficácia do sacrifício de Cristo.", "Toda a salvação nos vem através desta entrega total."], reflection: "Como eu deixo que a cruz e a ressurreição de Cristo transformem meus sofrimentos?", questions: [{ q: "O que se torna presente nos sacramentos?", a: "O mistério pascal de Cristo." }], quizQuestions: [{ q: "Qual é o centro de toda a vida litúrgica?", options: ["O Mistério Pascal de Cristo", "O Sermão da Montanha", "As Parábolas"], correct: 0 }] },
                { id: "celebro_3", categoryId: "celebro", title: "3. Os Sete Sacramentos", ccc: "CCC § 1210-1211", description: "Sinais sensíveis e eficazes da graça instituídos por Cristo.", explanation: "Os sacramentos são sinais sensíveis e eficazes da graça, instituídos por Cristo e confiados à Igreja, através dos quais nos é dada a vida divina.", keyPoints: ["Cristo instituiu exatamente sete sacramentos.", "Eles conferem a graça pela própria ação celebrada (ex opere operato).", "Eles edificam o Corpo místico de Cristo."], reflection: "Qual sacramento frequento com maior devoção e gratidão?", questions: [{ q: "Quantos são os sacramentos da Igreja?", a: "Sete." }], quizQuestions: [{ q: "Quantos são os sacramentos?", options: ["Sete", "Três", "Dez"], correct: 0 }] },
                { id: "celebro_4", categoryId: "celebro", title: "4. O Sacramento do Batismo", ccc: "CCC § 1213", description: "O fundamento de toda a vida cristã e a porta da vida no Espírito.", explanation: "O santo Batismo é o fundamento de toda a vida cristã, o pórtico da vida no Espírito e a porta que abre o acesso aos demais sacramentos. Pelo Batismo somos libertos do pecado e regenerados como filhos de Deus, tornando-nos membros de Cristo.", keyPoints: ["Apaga o pecado original e todos os pecados pessoais.", "Imprime na alma um selo espiritual indelével (caráter).", "Incorpora o fiel à Igreja."], reflection: "Eu lembro da data do meu Batismo? Renovo minhas promessas batismais?", questions: [{ q: "Qual o efeito principal do Batismo?", a: "A regeneração no Espírito Santo e o perdão dos pecados." }], quizQuestions: [{ q: "O Batismo apaga qual pecado?", options: ["O original e os atuais", "Apenas o pecado venial", "Nenhum pecado"], correct: 0 }] },
                { id: "celebro_5", categoryId: "celebro", title: "5. A Santíssima Eucaristia", ccc: "CCC § 1324-1327", description: "A fonte e o ápice de toda a vida cristã.", explanation: "A Eucaristia é a fonte e o ápice de toda a vida cristã. Os demais sacramentos e obras de apostolado estão vinculados à Eucaristia e a ela se ordenam, pois na Eucaristia está contido todo o bem espiritual da Igreja: o próprio Cristo, nossa Páscoa.", keyPoints: ["Presença real, verdadeira e substancial de Cristo (Transubstanciação).", "É o mesmo sacrifício da Cruz atualizado no altar.", "A comunhão aumenta a união do fiel com o Senhor."], reflection: "Preparo meu coração dignamente (estado de graça) antes de comungar?", questions: [{ q: "O que é a Transubstanciação?", a: "A conversão de toda a substância do pão e do vinho no Corpo e Sangue de Cristo." }], quizQuestions: [{ q: "Qual sacramento é o 'ápice' da vida cristã?", options: ["A Eucaristia", "O Matrimônio", "O Batismo"], correct: 0 }] },

                // VIVO (5 Aulas)
                { id: "vivo_1", categoryId: "vivo", title: "1. A Dignidade da Pessoa Humana", ccc: "CCC § 1700-1709", description: "Criado à imagem e semelhança de Deus.", explanation: "A dignidade da pessoa humana tem suas raízes na criação à imagem e semelhança de Deus; ela atinge sua plenitude na vocação divina à comunhão com o Criador.", keyPoints: ["Imagem e semelhança divina dão ao homem um valor incalculável.", "Todo ser humano é dotado de liberdade e inteligência.", "Somos chamados à bem-aventurança eterna."], reflection: "Reconheço a dignidade divina em cada pessoa com quem convivo?", questions: [{ q: "Qual é a raiz da dignidade humana?", a: "A criação à imagem e semelhança de Deus." }], quizQuestions: [{ q: "A dignidade humana fundamenta-se em quê?", options: ["Na criação à imagem de Deus", "Na riqueza material", "Nas leis dos homens"], correct: 0 }] },
                { id: "vivo_2", categoryId: "vivo", title: "2. Liberdade e Responsabilidade", ccc: "CCC § 1730-1734", description: "A liberdade é o poder de agir ou não agir, tendo a responsabilidade pelos próprios atos.", explanation: "Deus criou o homem racional e conferiu-lhe a dignidade de uma pessoa dotada de iniciativa e de domínio de seus atos. A liberdade não é fazer o que apetece, mas o poder radicado na razão e na vontade de fazer o bem.", keyPoints: ["Quanto mais faz o bem, mais o homem se torna livre.", "A liberdade humana é limitada e falível.", "Todo ato livre é imputável ao seu autor (responsabilidade)."], reflection: "Tenho usado minha liberdade para amar a Deus e servir ao próximo?", questions: [{ q: "O que torna um homem verdadeiramente livre?", a: "A escolha habitual do bem e a adesão à verdade." }], quizQuestions: [{ q: "A verdadeira liberdade cristã consiste em:", options: ["Poder escolher o bem e a verdade", "Fazer qualquer coisa sem limite", "Fugir das responsabilidades"], correct: 0 }] },
                { id: "vivo_3", categoryId: "vivo", title: "3. A Consciência Moral", ccc: "CCC § 1776-1782", description: "O santuário do homem, onde ele está a sós com Deus e escuta Sua voz.", explanation: "A consciência moral é um juízo da razão pelo qual o homem reconhece a qualidade moral de um ato concreto que vai praticar, que está praticando ou que já praticou. O homem tem o direito e o dever de seguir fielmente o que sabe ser justo.", keyPoints: ["A voz de Deus ressoa na consciência bem formada.", "É preciso educar a consciência pelas Escrituras e pelo Magistério.", "A consciência pode errar por ignorância."], reflection: "Tenho buscado formar minha consciência através do estudo do Catecismo?", questions: [{ q: "O que deve guiar as decisões do cristão?", a: "Uma consciência reta e bem formada." }], quizQuestions: [{ q: "Como devemos tratar a nossa consciência?", options: ["Devemos educá-la e segui-la", "Devemos ignorá-la", "Devemos moldá-la à opinião pública"], correct: 0 }] },
                { id: "vivo_4", categoryId: "vivo", title: "4. As Virtudes", ccc: "CCC § 1803-1811", description: "Uma disposição habitual e firme para fazer o bem.", explanation: "A virtude permite à pessoa não apenas praticar atos bons, mas dar o melhor de si. A moral cristã destaca as virtudes cardeais (prudência, justiça, fortaleza, temperança) e as virtudes teologais (fé, esperança, caridade) que nos unem a Deus.", keyPoints: ["Virtudes requerem repetição de bons atos (esforço).", "Virtudes teologais são infundidas por Deus na alma.", "A caridade é a maior de todas as virtudes."], reflection: "Qual virtude me falta para tratar melhor os de minha própria casa?", questions: [{ q: "Quais são as três virtudes teologais?", a: "Fé, esperança e caridade." }], quizQuestions: [{ q: "O que é uma virtude?", options: ["Uma disposição habitual e firme para o bem", "Um talento natural inato", "Uma regra escrita num papel"], correct: 0 }] },
                { id: "vivo_5", categoryId: "vivo", title: "5. O Pecado e a Conversão", ccc: "CCC § 1849-1851", description: "O pecado é uma falta contra a razão, a verdade e a reta consciência.", explanation: "O pecado é uma ofensa a Deus que fere a natureza do homem e atenta contra a solidariedade humana. Distingue-se em mortal (que destrói a caridade no coração) e venial (que enfraquece a caridade, mas não a destrói). A misericórdia de Deus, no entanto, é sempre maior que nossa miséria.", keyPoints: ["Pecado mortal exige matéria grave, pleno conhecimento e pleno consentimento.", "A conversão é um retorno incessante ao Pai.", "O sacramento da Confissão apaga os pecados cometidos após o Batismo."], reflection: "Faço exames de consciência regulares para buscar a conversão verdadeira?", questions: [{ q: "Quais as três condições para que um pecado seja mortal?", a: "Matéria grave, pleno conhecimento e deliberado consentimento." }], quizQuestions: [{ q: "O pecado que destrói a graça no coração é chamado de:", options: ["Pecado mortal", "Pecado original", "Pecado material"], correct: 0 }] },

                // REZO (5 Aulas)
                { id: "rezo_1", categoryId: "rezo", title: "1. O que é a Oração", ccc: "CCC § 2558-2565", description: "Elevação da alma a Deus ou pedido de bens concordes com a sua vontade.", explanation: "A oração é a elevação da alma a Deus ou o pedido a Deus de bens concordes com a sua vontade. De onde vem a oração do homem? Seja qual for a linguagem da oração, o homem é quem ora, e é a Trindade que atrai esse coração para o diálogo.", keyPoints: ["É um diálogo de amor com o Criador.", "É um dom da graça e resposta da fé.", "Pressupõe o recolhimento e a humildade."], reflection: "Como encaro meus momentos de colóquio íntimo com Deus?", questions: [{ q: "O que é a oração em essência?", a: "A elevação da alma a Deus." }], quizQuestions: [{ q: "Em que consiste a oração?", options: ["Elevação da alma a Deus", "Repetição mecânica de palavras", "Isolamento do mundo"], correct: 0 }] },
                { id: "rezo_2", categoryId: "rezo", title: "2. As Fontes da Oração Cristã", ccc: "CCC § 2652-2660", description: "O Espírito Santo é a água viva que nos introduz na oração.", explanation: "O Espírito Santo que nos ensina a orar, nos remete às fontes da oração: a Palavra de Deus (Sagrada Escritura), a Liturgia da Igreja, as virtudes teologais (fé, esperança e caridade) e os acontecimentos do dia-a-dia da nossa vida humana.", keyPoints: ["A Bíblia é a fonte primária da escuta de Deus.", "A Liturgia prolonga a oração comunitária.", "Cada momento do dia pode ser transformado em prece."], reflection: "Costumo rezar a partir de trechos da Bíblia (Lectio Divina)?", questions: [{ q: "Qual o papel do Espírito Santo na oração?", a: "Ele é o Mestre interior que nos ensina a rezar." }], quizQuestions: [{ q: "Onde o cristão encontra a fonte principal de sua oração?", options: ["Na Palavra de Deus e na Liturgia", "Em livros de autoajuda", "No folclore"], correct: 0 }] },
                { id: "rezo_3", categoryId: "rezo", title: "3. As Formas da Oração", ccc: "CCC § 2626-2643", description: "O Espírito Santo, na Igreja, ensina as várias formas de se dirigir a Deus.", explanation: "A tradição cristã conservou as principais formas de oração reveladas nas Escrituras: bênção e adoração (reconhecer a Deus como Deus), petição (pedir perdão ou necessidades), intercessão (rezar pelos outros), ação de graças (agradecer) e louvor (dar glória a Deus pelo que Ele é).", keyPoints: ["O louvor reconhece que Deus é Deus de forma desinteressada.", "A intercessão une o nosso coração ao de Cristo que reza por nós.", "A Eucaristia contém e exprime todas as formas de oração."], reflection: "Minha oração é feita apenas de pedidos ou sei louvar e adorar a Deus?", questions: [{ q: "O que caracteriza a oração de Adoração?", a: "Reconhecer, com respeito e submissão, Deus como Criador e Senhor absoluto." }], quizQuestions: [{ q: "Que tipo de oração se concentra em pedir por outras pessoas?", options: ["Intercessão", "Ação de graças", "Petição pessoal"], correct: 0 }] },
                { id: "rezo_4", categoryId: "rezo", title: "4. Dificuldades na Oração", ccc: "CCC § 2725-2733", description: "O combate espiritual da oração.", explanation: "A oração é um dom da graça, mas requer um combate constante. As dificuldades mais comuns são a distração, que desvia nossa atenção; a secura, que nos faz sentir o coração árido; e a acédia (preguiça espiritual). O remédio é a vigilância, a fidelidade ao tempo de oração e a confiança filial em Deus.", keyPoints: ["A distração revela no que nosso coração está apegado.", "A secura é um tempo de purificação para amarmos a Deus sem buscar consolações.", "Devemos perseverar mesmo quando não temos vontade."], reflection: "Abandono a oração facilmente quando sinto desânimo ou distração?", questions: [{ q: "Como devemos agir diante da aridez espiritual?", a: "Perseverar na fé, unindo-nos à Cruz de Cristo." }], quizQuestions: [{ q: "Como se chama a 'preguiça espiritual' que atrapalha a oração?", options: ["Acédia", "Meditação", "Gula"], correct: 0 }] },
                { id: "rezo_5", categoryId: "rezo", title: "5. A Oração do Senhor — Pai-Nosso", ccc: "CCC § 2759-2761", description: "O resumo de todo o Evangelho.", explanation: "A oração do Pai-Nosso é verdadeiramente o resumo de todo o Evangelho. Ensinada pelo próprio Jesus, é a oração perfeita. Nela, não só pedimos tudo o que podemos desejar retamente, mas o fazemos na ordem em que os desejos devem estar.", keyPoints: ["Chamar Deus de 'Pai' é um privilégio dado pelo Espírito de adoção.", "Contém sete petições: três para a glória de Deus, quatro para nossas necessidades.", "Requer um coração pronto para perdoar aos irmãos."], reflection: "Rezo o Pai-Nosso prestando atenção em cada palavra ou apenas de forma mecânica?", questions: [{ q: "Quem ensinou a oração do Pai-Nosso?", a: "Jesus Cristo aos seus apóstolos." }], quizQuestions: [{ q: "Segundo Santo Tomás de Aquino, o Pai-Nosso é o quê?", options: ["A oração mais perfeita e resumo do Evangelho", "Uma oração inventada na Idade Média", "Um cântico hebraico pré-cristão"], correct: 0 }] }
            ]
        };

                { id: "s_1", name: "São Pedro Apóstolo", memoryDate: "29 de Junho", birth: "Betsaida", death: "Roma (64 d.C.)", country: "Galileia / Itália", vocation: "Apóstolo e Sumo Pontífice", biography: "Príncipe dos Apóstolos, primeiro Papa da Igreja Católica, testemunha da transfiguração e rocha sobre a qual Cristo fundou sua Igreja. Pescador chamado às margens do lago de Genesaré, confessou a divindade de Jesus em Cesareia de Filipe e recebeu as chaves do Reino. Após negar o Mestre três vezes, foi confirmado no amor junto ao lago e pastoreou a Igreja nascente até o martírio em Roma, crucificado de cabeça para baixo por não se julgar digno de morrer como o Senhor.", virtues: ["Fé ardente", "Arrependimento", "Coragem apostólica"], patronage: "Pescadores, Papas, Construtores", mainTeaching: "Tu és o Cristo, o Filho do Deus vivo.", feast: "29 de Junho", prayer: "Ó São Pedro, rocha da Igreja, que confessastes a divindade de Cristo e chorastes amargamente a vossa fraqueza, alcançai-nos uma fé firme e um coração arrependido. Rogai por nós.", reflection: "A fraqueza humana transformada pela misericórdia de Cristo torna-se fundamento da Igreja.", sources: "Tradição apostólica e Novo Testamento" },
                { id: "s_2", name: "São Francisco de Assis", memoryDate: "4 de Outubro", birth: "Assis, Itália (1181)", death: "1226", country: "Itália", vocation: "Fundador da Ordem dos Frades Menores", biography: "Poverello de Assis, renunciou a todas as riquezas para viver o Evangelho em absoluta pobreza e fraternidade com toda a criação. Filho de comerciante rico, após uma juventude mundana e o cativeiro de guerra, ouviu a voz do Crucificado de São Damião: 'Repara a minha Igreja'. Fundou os Frades Menores, recebeu os estigmas no monte Alverne e compôs o Cântico das Criaturas, louvando a Deus pelo irmão sol, pela irmã lua e pela irmã morte.", virtues: ["Pobreza evangélica", "Alegria espiritual", "Amor à criação"], patronage: "Ecologistas, Animais, Itália", mainTeaching: "Senhor, fazei-me instrumento de vossa paz.", feast: "4 de Outubro", prayer: "São Francisco, amante da pobreza e da paz, ensinai-nos a despojar o coração das ambições e a ver em cada criatura um dom do Pai. Rogai por nós.", reflection: "A verdadeira paz habita no coração despojado de egoísmo.", sources: "Fontes Franciscanas" },
                { id: "s_3", name: "Santa Teresinha do Menino Jesus", memoryDate: "1º de Outubro", birth: "Alençon, França (1873)", death: "Lisieux (1897)", country: "França", vocation: "Carmelita descalça e Doutora da Igreja", biography: "Entrou no Carmelo de Lisieux aos 15 anos e ali viveu escondida apenas 9 anos, até morrer de tuberculose aos 24. Sua autobiografia, 'História de uma Alma', revelou ao mundo a 'pequena via' da infância espiritual: fazer as pequenas coisas com grande amor, confiando-se inteiramente à misericórdia de Deus. Prometeu: 'Depois da minha morte, farei cair uma chuva de rosas'. É padroeira das missões sem jamais ter saído do convento.", virtues: ["Confiança filial", "Simplicidade", "Amor escondido"], patronage: "Missões, Floristas, Enfermos", mainTeaching: "Quero passar o meu céu fazendo o bem na terra.", feast: "1º de Outubro", prayer: "Santa Teresinha, pequena flor de Jesus, ensinai-nos a pequena via da confiança e do amor nas coisas simples. Rogai por nós.", reflection: "A santidade não está nas grandes façanhas, mas no amor colocado nas pequenas coisas.", sources: "História de uma Alma (Manuscritos autobiográficos)" },
                { id: "s_4", name: "Santo Agostinho de Hipona", memoryDate: "28 de Agosto", birth: "Tagaste, Argélia (354)", death: "Hipona (430)", country: "Argélia / Itália", vocation: "Bispo, Doutor da Igreja e Teólogo", biography: "Após uma juventude de buscas intelectuais e vida desregrada, converteu-se aos 32 anos no jardim de Milão, ao ouvir 'tolle lege' (toma e lê) e abrir as Cartas de São Paulo. Batizado por Santo Ambrósio, tornou-se bispo de Hipona e o maior pensador do cristianismo antigo. Suas 'Confissões' narram o inquieto coração humano que só descansa em Deus. Escreveu 'A Cidade de Deus' enquanto Roma caía sob os bárbaros.", virtues: ["Busca incansável da verdade", "Sabedoria", "Penitência"], patronage: "Teólogos, Convertidos, Cervejeiros", mainTeaching: "Fizeste-nos para Ti, e inquieto está o nosso coração enquanto não repousar em Ti.", feast: "28 de Agosto", prayer: "Santo Agostinho, que buscastes a verdade por tantos caminhos até encontrá-la em Cristo, guiai nossa inteligência e nosso coração para Deus. Rogai por nós.", reflection: "Tarde Te amei, ó Beleza tão antiga e tão nova, tarde Te amei!", sources: "Confissões; A Cidade de Deus" },
                { id: "s_5", name: "Santa Rita de Cáscia", memoryDate: "22 de Maio", birth: "Roccaporena, Itália (1381)", death: "Cáscia (1457)", country: "Itália", vocation: "Agostiniana, esposa e mãe", biography: "Casou-se jovem com homem violento, que converteu pela paciência e pela oração antes de ele ser assassinado. Perdoou os assassinos e impediu a vingança dos filhos. Viúva, entrou no mosteiro agostiniano de Cáscia, onde recebeu na fronte um estigma da coroa de espinhos. É invocada como 'santa dos impossíveis' e advogada das causas perdidas, pois sua vida inteira foi um tecido de situações humanamente sem saída resolvidas pela graça.", virtues: ["Paciência na adversidade", "Perdão", "Perseverança na oração"], patronage: "Causas impossíveis, Casamentos difíceis, Mães", mainTeaching: "Nada é impossível para quem confia em Deus.", feast: "22 de Maio", prayer: "Santa Rita, advogada dos impossíveis, que transformastes a cruz em caminho de paz, intercedei pelas nossas causas mais difíceis. Rogai por nós.", reflection: "O perdão é a força que desarma a vingança e abre caminho à graça.", sources: "Tradição agostiniana" },
                { id: "s_6", name: "São José", memoryDate: "19 de Março", birth: "Belém", death: "Nazaré (antes da vida pública de Jesus)", country: "Palestina", vocation: "Esposo de Maria e pai adotivo de Jesus", biography: "O 'justo' do Evangelho: carpinteiro de Nazaré que acolheu Maria e o Filho de Deus em silêncio e obediência. Guardião do Redentor, fugiu para o Egito, sustentou a Sagrada Família com o trabalho das mãos e ensinou o ofício a Jesus. Nenhuma palavra sua está registrada no Evangelho: sua grandeza está na escuta e na ação fiel. Patrono da Igreja universal, dos trabalhadores e da boa morte.", virtues: ["Justiça", "Silêncio operoso", "Obediência à vontade de Deus"], patronage: "Trabalhadores, Famílias, Igreja universal, Moribundos", mainTeaching: "Fazer em silêncio a vontade de Deus, como o justo que obedece.", feast: "19 de Março e 1º de Maio (São José Operário)", prayer: "São José, guardião do Redentor e esposo virginal de Maria, protegei nossas famílias e ensinai-nos a trabalhar e a obedecer em silêncio. Rogai por nós.", reflection: "A maior santidade pode ser vivida no anonimato do dever cumprido com amor.", sources: "Evangelhos de Mateus e Lucas" },
                { id: "s_7", name: "Santa Faustina Kowalska", memoryDate: "5 de Outubro", birth: "Glogowiec, Polônia (1905)", death: "Cracóvia (1938)", country: "Polônia", vocation: "Religiosa da Misericórdia e Apóstola da Divina Misericórdia", biography: "Irmã da Congregação de Nossa Senhora da Misericórdia, recebeu de Jesus a missão de proclamar ao mundo a Divina Misericórdia. Em seu 'Diário', registrou as palavras do Senhor: 'A humanidade não terá paz enquanto não se voltar com confiança para a minha misericórdia'. Transmitiu a imagem de Jesus Misericordioso ('Jesus, eu confio em Vós'), a coroa da Divina Misericórdia e a Festa da Misericórdia no domingo após a Páscoa.", virtues: ["Confiança na misericórdia", "Obediência", "Humildade"], patronage: "Apóstolos da Misericórdia, Moribundos", mainTeaching: "Jesus, eu confio em Vós.", feast: "5 de Outubro", prayer: "Santa Faustina, secretária da Divina Misericórdia, ensinai-nos a confiar sem limites no coração de Jesus. Rogai por nós.", reflection: "A misericórdia de Deus é maior que todos os nossos pecados juntos.", sources: "Diário de Santa Faustina" },
                { id: "s_8", name: "São Padre Pio de Pietrelcina", memoryDate: "23 de Setembro", birth: "Pietrelcina, Itália (1887)", death: "San Giovanni Rotondo (1968)", country: "Itália", vocation: "Capuchinho, estigmatizado e confessor", biography: "Frei capuchinho que carregou por 50 anos os estigmas da Paixão de Cristo. Passava até 16 horas por dia no confessionário, lendo consciências e conduzindo almas a Deus. Fundou a Casa Alívio do Sofrimento, hospital de excelência, e os Grupos de Oração. Sofreu perseguições e suspeitas, permanecendo obediente. Seu lema resume a espiritualidade que deixou: 'Reza, espera e não te preocupes'.", virtues: ["Vida de oração", "Paciência no sofrimento", "Zelo pelas almas"], patronage: "Confessores, Enfermos, Grupos de oração", mainTeaching: "Reza, espera e não te preocupes.", feast: "23 de Setembro", prayer: "Padre Pio, que carregastes as chagas de Cristo com amor, alcançai-nos a graça de uma oração constante e de um coração confiante. Rogai por nós.", reflection: "O sofrimento unido ao de Cristo torna-se instrumento de redenção.", sources: "Epistolário e testemunhos do convento de San Giovanni Rotondo" }
            ],

            /** Santo do dia: rotação determinística pela data, para que cada dia mostre um santo diferente. */
            getSaintOfDay(dateStr = new Date().toISOString().split('T')[0]) {
                const d = new Date(dateStr + 'T12:00:00');
                const dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
                return this.saints[dayOfYear % this.saints.length];
            }

        function saveState() {

            updateHeaderBadges();

        function updateHeaderBadges() {
            const streakEls = document.querySelectorAll('#header-streak, #sidebar-streak');
            streakEls.forEach(el => el.innerText = AppState.streak);
            const xpEls = document.querySelectorAll('#header-xp');
            xpEls.forEach(el => el.innerText = AppState.xp);

            const levelNames = ["Iniciante", "Discípulo", "Peregrino", "Estudioso", "Servo Fiel", "Mestre da Fé"];
            const currentLevelIdx = Math.min(Math.floor(AppState.xp / 150), levelNames.length - 1);
            const levelEl = document.getElementById('sidebar-level-title');
            if (levelEl) levelEl.innerText = levelNames[currentLevelIdx];
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold flex items-center gap-3 transition transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-amber-50 border-amber-300 text-amber-900' : 'bg-blue-50 border-blue-200 text-blue-900'
            }`;
            toast.innerHTML = `<span>${type === 'success' ? '✨' : 'ℹ️'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

            const achievements = [
                { id: 'first_study', title: 'Primeiro Estudo', condition: AppState.completedLessons.length > 0 },
                { id: 'five_lessons', title: 'Peregrino da Fé', condition: AppState.completedLessons.length >= 5 },
                { id: 'first_quiz', title: 'Primeiro Quiz', condition: AppState.completedQuizzes.length > 0 },
                { id: 'prayer_streak', title: 'Amigo da Oração', condition: AppState.streak >= 3 },
                { id: 'fav_collector', title: 'Colecionador de Tesouros', condition: AppState.favorites.length >= 3 }
            ];

            achievements.forEach(ach => {
                if (ach.condition && !AppState.unlockedAchievements.includes(ach.id)) {
                    AppState.unlockedAchievements.push(ach.id);
                    showToast(`🏆 Conquista desbloqueada: ${ach.title}!`, 'success');
                }
            });
        }

        /* ==========================================
           5. FUNÇÕES AUXILIARES E INTERAÇÕES
           ========================================== */
        function goToPreviousLiturgicalDay(currentDate) {
            let d = new Date(currentDate);
            d.setDate(d.getDate() - 1);
            router.navigate('liturgia', d.toISOString().split('T')[0]);
        }

        function goToTodayLiturgicalDay() {
            router.navigate('liturgia', new Date().toISOString().split('T')[0]);
        }

        function goToNextLiturgicalDay(currentDate) {
            let d = new Date(currentDate);
            d.setDate(d.getDate() + 1);
            router.navigate('liturgia', d.toISOString().split('T')[0]);
        }

        function markLiturgicalRead(date) {
            if (AppState.liturgicalRead[date]) {
                showToast("Esta liturgia já foi lida!", "info");
                return;
            }
            AppState.liturgicalRead[date] = true;
            AppState.xp += 15;
            if (!AppState.unlockedAchievements.includes('first_liturgy')) {
                AppState.unlockedAchievements.push('first_liturgy');
                showToast("🏆 Conquista: Ouvinte da Palavra!", "success");
            }
            saveState();
            showToast("Liturgia lida! +15 XP", "success");
            router.navigate('liturgia', date);
        }

        function markPrayerDone() {
            const today = new Date().toISOString().split('T')[0];
            if (AppState.lastPrayerDate === today) {
                showToast("Você já concluiu a oração de hoje.", "info");
                return;
            }
            const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            const yStr = yesterday.toISOString().split('T')[0];
            AppState.streak = (AppState.lastPrayerDate === yStr) ? AppState.streak + 1 : 1;
            AppState.lastPrayerDate = today;
            AppState.xp += 10;
            saveState();
            showToast(`Momento de oração concluído! +10 XP • Ofensiva: ${AppState.streak} dia(s)`, "success");
            router.navigate('oracao');
        }

        function filterPrayers(category, btn) {
            document.querySelectorAll('.prayer-filter').forEach(b => {
                b.classList.remove('bg-mariana', 'text-white');
                b.classList.add('bg-slate-100', 'text-slate-700');
            });
            btn.classList.remove('bg-slate-100', 'text-slate-700');
            btn.classList.add('bg-mariana', 'text-white');
            document.querySelectorAll('.prayer-item').forEach(item => {
                item.style.display = (!category || item.dataset.category === category) ? '' : 'none';
            });
        }

        function openPrayerModal(id) {
            const p = PrayerContentProvider.prayers.find(x => x.id === id);
            if (!p) return;
            const isFav = AppState.favorites.includes('prayer_' + id);
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="bg-white w-full max-w-2xl rounded-3xl p-6 md:p-8 space-y-6 max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl border relative">

                        <button onclick="closeModal()" class="text-slate-400 font-bold text-xl hover:text-red-500 transition">✕</button>
                    </div>
                    <div class="pr-16">
                        <span class="px-2.5 py-1 bg-amber-100 text-amber-900 rounded-lg text-[10px] font-bold tracking-wider uppercase">${p.category}</span>

                        <p class="font-serif text-base text-slate-800 leading-loose whitespace-pre-line">${p.text}</p>
                    </div>
                    <button onclick="closeModal(); markPrayerDone();" class="w-full py-3.5 mariana-gradient text-white rounded-xl text-xs font-bold shadow-md transition hover:scale-105">🙏 Rezei esta oração (+10 XP)</button>
                </div>
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function openSaintModal(id) {
            const s = SaintContentProvider.saints.find(x => x.id === id);
            if (!s) return;
            const isFav = AppState.favorites.includes('saint_' + id);
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="bg-white w-full max-w-2xl rounded-3xl p-6 md:p-8 space-y-6 max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl border relative">
                    <div class="absolute top-6 right-6 flex gap-3">
                        <button onclick="toggleFavorite('saint_${s.id}')" class="text-lg" title="Favoritar">${isFav ? '⭐' : '☆'}</button>
                        <button onclick="closeModal()" class="text-slate-400 font-bold text-xl hover:text-red-500 transition">✕</button>
                    </div>
                    <div class="pr-16">
                        <span class="px-2.5 py-1 bg-amber-100 text-amber-900 rounded-lg text-[10px] font-bold tracking-wider uppercase">Festa: ${s.feast}</span>
                        <h3 class="font-serif text-2xl md:text-3xl font-bold text-mariana mt-3 leading-tight">${s.name}</h3>
                        <p class="text-xs text-slate-500 mt-1">${s.vocation}</p>
                    </div>
                    <p class="font-serif text-base text-dourado italic">"${s.mainTeaching}"</p>
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <p class="text-sm text-slate-700 leading-relaxed">${s.biography}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div class="p-3 bg-slate-50 rounded-xl"><span class="font-bold text-slate-500 block">Padroeiro de</span><span class="text-slate-800">${s.patronage}</span></div>
                        <div class="p-3 bg-slate-50 rounded-xl"><span class="font-bold text-slate-500 block">Fontes</span><span class="text-slate-800">${s.sources}</span></div>
                    </div>
                    <div class="bg-amber-50/70 p-5 rounded-2xl border border-amber-200/60">
                        <h4 class="text-xs font-bold text-amber-900 uppercase tracking-wider mb-2">Oração</h4>
                        <p class="text-xs text-amber-800 italic leading-relaxed">${s.prayer}</p>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function activatePlan(planId) {
            AppState.activeStudyPlan = planId;
            if (!AppState.planProgress[planId]) AppState.planProgress[planId] = [];
            saveState();
            showToast("Plano ativado! Avance uma aula por dia.", "success");
            router.navigate('planos');
        }

        /* ---- Quiz engine ---- */
        let QuizSession = null;

        function startQuiz(category) {
            let pool = category ? QuizContentProvider.questions.filter(q => q.category === category) : [...QuizContentProvider.questions];
            pool = pool.sort(() => Math.random() - 0.5).slice(0, 5);
            QuizSession = { questions: pool, index: 0, correct: 0, answered: false };
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const area = document.getElementById('quiz-area');
            if (!area || !QuizSession) return;
            const s = QuizSession;
            if (s.index >= s.questions.length) {
                const pct = Math.round((s.correct / s.questions.length) * 100);
                const xp = s.correct * 10;
                AppState.xp += xp;
                AppState.completedQuizzes.push(Date.now());
                if (pct >= 80 && !AppState.unlockedAchievements.includes('quiz_master')) {
                    AppState.unlockedAchievements.push('quiz_master');
                    showToast("🏆 Conquista: Mente Iluminada!", "success");
                }
                saveState();
                area.innerHTML = `
                    <div class="bg-white rounded-3xl p-8 border border-slate-200 card-shadow text-center space-y-4">
                        <span class="text-5xl">${pct >= 80 ? '🏆' : pct >= 50 ? '💪' : '📖'}</span>
                        <h3 class="font-serif text-2xl font-bold text-mariana">Quiz concluído!</h3>
                        <p class="text-sm text-slate-600">Você acertou <strong>${s.correct} de ${s.questions.length}</strong> (${pct}%) e ganhou <strong>+${xp} XP</strong>.</p>
                        <div class="flex gap-3 justify-center pt-2">
                            <button onclick="startQuiz(null)" class="px-6 py-3 mariana-gradient text-white rounded-xl text-xs font-bold transition hover:scale-105">🎲 Novo quiz</button>
                            <button onclick="router.navigate('catecismo')" class="px-6 py-3 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition hover:bg-slate-200">Estudar mais</button>
                        </div>
                    </div>
                `;
                QuizSession = null;
                return;
            }
            const q = s.questions[s.index];
            area.innerHTML = `
                <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-200 card-shadow space-y-5">
                    <div class="flex items-center justify-between text-xs font-bold text-slate-500">
                        <span>Pergunta ${s.index + 1} de ${s.questions.length}</span>
                        <span class="px-2.5 py-1 bg-slate-100 rounded-lg">${q.category} • ${q.difficulty}</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div class="gold-gradient h-full rounded-full transition-all" style="width: ${(s.index / s.questions.length) * 100}%"></div>
                    </div>
                    <h3 class="font-serif text-xl md:text-2xl font-bold text-mariana leading-snug">${q.question}</h3>
                    <div class="space-y-2.5" id="quiz-options">
                        ${q.options.map((opt, i) => `
                            <button onclick="answerQuiz(${i})" data-idx="${i}" class="quiz-opt w-full p-4 text-left rounded-2xl border border-slate-200 bg-slate-50 hover:border-mariana hover:bg-blue-50 text-sm font-semibold text-slate-700 transition">
                                ${String.fromCharCode(65 + i)}) ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div id="quiz-feedback"></div>
                </div>
            `;
        }

        function answerQuiz(idx) {
            const s = QuizSession;
            if (!s || s.answered) return;
            s.answered = true;
            const q = s.questions[s.index];
            const isCorrect = idx === q.correctAnswer;
            if (isCorrect) s.correct++;
            document.querySelectorAll('.quiz-opt').forEach(btn => {
                const i = parseInt(btn.dataset.idx);
                btn.disabled = true;
                if (i === q.correctAnswer) btn.className = 'quiz-opt w-full p-4 text-left rounded-2xl border border-emerald-400 bg-emerald-50 text-sm font-semibold text-emerald-900 transition';
                else if (i === idx) btn.className = 'quiz-opt w-full p-4 text-left rounded-2xl border border-red-300 bg-red-50 text-sm font-semibold text-red-800 transition';
                else btn.className = 'quiz-opt w-full p-4 text-left rounded-2xl border border-slate-200 bg-slate-50 text-sm font-semibold text-slate-400 transition';
            });
            document.getElementById('quiz-feedback').innerHTML = `
                <div class="p-4 rounded-2xl ${isCorrect ? 'bg-emerald-50 border border-emerald-200' : 'bg-red-50 border border-red-200'} space-y-1.5">
                    <p class="text-xs font-bold ${isCorrect ? 'text-emerald-800' : 'text-red-800'}">${isCorrect ? '✓ Resposta correta!' : '✗ Resposta incorreta.'}</p>
                    <p class="text-xs text-slate-700 leading-relaxed">${q.explanation}</p>
                    <span class="text-[10px] font-bold text-dourado">${q.ccc}</span>
                </div>
                <button onclick="nextQuizQuestion()" class="w-full py-3 mariana-gradient text-white rounded-xl text-xs font-bold transition hover:scale-105 mt-3">${s.index + 1 >= s.questions.length ? 'Ver resultado' : 'Próxima pergunta →'}</button>
            `;
        }

        function nextQuizQuestion() {
            if (!QuizSession) return;
            QuizSession.index++;
            QuizSession.answered = false;
            renderQuizQuestion();
        }

        function toggleFavorite(id) {
            if (AppState.favorites.includes(id)) {
                AppState.favorites = AppState.favorites.filter(f => f !== id);
                showToast("Removido dos favoritos.");
            } else {
                AppState.favorites.push(id);
                showToast("Salvo nos favoritos!");
            }
            saveState();
            if (router.currentRoute === 'favoritos') router.navigate('favoritos');
            
            // Re-render modal se estiver aberto
            const modal = document.getElementById('modal-container');
            if (!modal.classList.contains('hidden') && id.startsWith('lesson_')) {
                openLessonModal(id.replace('lesson_', ''));
            }
        }

        function openLessonModal(id) {
            const mod = CatecismContentProvider.modules.find(m => m.id === id);
            if (!mod) return;
            const isDone = AppState.completedLessons.includes(id);
            const isFav = AppState.favorites.includes('lesson_' + id);

            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="bg-white w-full max-w-2xl rounded-3xl p-6 md:p-8 space-y-6 max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl border relative">
                    <div class="absolute top-6 right-6 flex gap-3">
                        <button onclick="toggleFavorite('lesson_${mod.id}')" class="text-lg" title="Favoritar">${isFav ? '⭐' : '☆'}</button>
                        <button onclick="closeModal()" class="text-slate-400 font-bold text-xl hover:text-red-500 transition">✕</button>
                    </div>
                    
                    <div class="pr-16">
                        <span class="px-2.5 py-1 bg-amber-100 text-amber-900 rounded-lg text-[10px] font-bold tracking-wider">${mod.ccc}</span>
                        <h3 class="font-serif text-2xl md:text-3xl font-bold text-mariana mt-3 leading-tight">${mod.title}</h3>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <p class="text-sm text-slate-700 leading-relaxed font-medium">${mod.explanation}</p>
                    </div>

                    <div class="space-y-3">
                        <h4 class="text-xs font-bold text-mariana uppercase tracking-wider">Pontos Principais para Guardar</h4>
                        <ul class="list-none space-y-2">
                            ${mod.keyPoints.map(kp => `<li class="flex items-start gap-2 text-xs text-slate-600"><span class="text-dourado font-bold mt-0.5">•</span> <span>${kp}</span></li>`).join('')}
                        </ul>
                    </div>

                    <div class="bg-amber-50/70 p-5 rounded-2xl border border-amber-200/60">
                        <h4 class="text-xs font-bold text-amber-900 uppercase tracking-wider mb-2">Reflexão Prática</h4>
                        <p class="text-xs text-amber-800 italic leading-relaxed">"${mod.reflection}"</p>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-6 border-t border-slate-100">
                        <button onclick="completeLesson('${mod.id}')" class="w-full sm:w-auto px-6 py-3.5 ${isDone ? 'bg-emerald-700 text-white' : 'mariana-gradient text-white'} rounded-xl text-xs font-bold shadow-md transition transform hover:scale-105">
                            ${isDone ? '✓ Módulo Concluído' : '✅ Marcar como Concluído (+25 XP)'}
                        </button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function completeLesson(id) {
            if (!AppState.completedLessons.includes(id)) {
                AppState.completedLessons.push(id);
                AppState.xp += 25;
                saveState();
                showToast("Parabéns! Aula concluída. +25 XP", "success");
            } else {
                showToast("Você já havia concluído este módulo.", "info");
            }
            closeModal();
            if (router.currentRoute === 'catecismo') router.navigate('catecismo');
            if (router.currentRoute === 'progresso') router.navigate('progresso');
            if (router.currentRoute === 'home') router.navigate('home');
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function handleSearch(query) {
            if (!query || query.length < 2) return;
            router.navigate('pesquisa');
            setTimeout(() => {
                const input = document.getElementById('search-box-input');
                if (input) { input.value = query; executeSearch(query); }
            }, 50);
        }

        function executeSearch(query) {
            const container = document.getElementById('search-results-container');
            if (!query || query.length < 2) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Digite acima para pesquisar.</p>`;
                return;
            }

            const q = query.toLowerCase();
            const matchedModules = CatecismContentProvider.modules.filter(m => 
                m.title.toLowerCase().includes(q) || 
                m.description.toLowerCase().includes(q) || 
                m.explanation.toLowerCase().includes(q) ||
                m.ccc.toLowerCase().includes(q)
            );

            let html = '';
            if (matchedModules.length > 0) {
                html += `<h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Catecismo da Igreja Católica (${matchedModules.length})</h4>`;
                matchedModules.forEach(m => {
                    html += `
                        <div onclick="openLessonModal('${m.id}')" class="p-4 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition mb-2 shadow-sm">
                            <span class="text-[10px] text-amber-600 font-bold block mb-1">${m.ccc}</span>
                            <span class="text-sm font-bold text-mariana">${m.title}</span>
                            <p class="text-xs text-slate-500 mt-1 line-clamp-1">${m.description}</p>
                        </div>
                    `;
                });
            }

            if (!html) html = `<p class="text-xs text-slate-400 text-center py-6">Nenhum resultado encontrado para "${query}".</p>`;
            container.innerHTML = html;
        }

        window.onload = function() {
            loadState();
            router.navigate('home');
        };
    </script>
</body>
</html>
