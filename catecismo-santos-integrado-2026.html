    <!-- JavaScript Data & Logic Providers -->
    <script>
        /* ==========================================
           1. DATA PROVIDERS DEFINITION
           ========================================== */
        function getLocalDateString(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        const LiturgicalContentProvider = {
            // Banco local gerado pelos scripts de atualização do projeto.
            LOCAL_BASE_URL: './data/liturgia/',
            API_BASE_URL: 'https://api-liturgia-diaria.vercel.app/',
            FALLBACK_API_BASE_URL: 'https://liturgia.up.railway.app/v3',
            API_CACHE_KEY: 'catecismo_liturgia_api_cache_v3',
            API_CACHE_TTL_MS: 24 * 60 * 60 * 1000,

            _weekdayPt(dateStr) {
                const d = new Date(dateStr + 'T12:00:00');
                return ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][d.getDay()];
            },
            _stripHtml(value) {
                const div = document.createElement('div');
                div.innerHTML = String(value || '');
                return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
            },
            _normalizeLocalReading(reading, kind='') {
                if (!reading) return null;
                return {
                    reference: this._stripHtml(reading.reference || ''),
                    title: this._stripHtml(reading.title || ''),
                    refrain: this._stripHtml(reading.refrain || ''),
                    text: String(reading.text || ''),
                    kind
                };
            },
            async fetchFromLocal(dateStr) {
                const year = dateStr.slice(0,4);
                const url = `${this.LOCAL_BASE_URL}${year}/${dateStr}.json`;
                const response = await fetch(url, { cache:'no-store' });
                if (!response.ok) throw new Error(`Banco local indisponível (${response.status})`);
                const j = await response.json();
                if (!j || j.date !== dateStr) throw new Error('JSON local retornou data diferente da solicitada.');
                const r = j.readings || {};
                const firstReading = this._normalizeLocalReading(r.firstReading, 'leitura');
                const secondReading = r.secondReading ? this._normalizeLocalReading(r.secondReading, 'leitura') : null;
                const psalm = this._normalizeLocalReading(r.psalm, 'salmo');
                const gospel = this._normalizeLocalReading(r.gospel, 'evangelho');
                if (!firstReading?.reference || !firstReading?.text || !psalm?.reference || !psalm?.text || !gospel?.reference || !gospel?.text) {
                    throw new Error('Registro local incompleto.');
                }
                const celebration = this._stripHtml(j.heading || '').trim() || 'Liturgia Diária';
                return {
                    source: j.source || 'Banco local de Liturgia',
                    sourceUrl: j.sourceUrl || '',
                    date: dateStr,
                    apiDate: dateStr,
                    weekday: this._weekdayPt(dateStr),
                    celebration,
                    entryTitle: celebration,
                    liturgicalSeason: /advento/i.test(celebration) ? 'Advento' : /quaresma/i.test(celebration) ? 'Quaresma' : /pascal|páscoa/i.test(celebration) ? 'Tempo Pascal' : /natal/i.test(celebration) ? 'Tempo do Natal' : /tempo comum/i.test(celebration) ? 'Tempo Comum' : '',
                    liturgicalColor: this._stripHtml(j.color || '').trim() || 'verde',
                    rank: /domingo|solenidade|festa|mem[oó]ria/i.test(celebration) ? 'Celebração' : 'Féria',
                    saintOrMemory: celebration,
                    firstReading,
                    secondReading,
                    psalm,
                    gospel,
                    prayers: null,
                    antiphons: null,
                    extras: Array.isArray(j.extra) ? j.extra.map(x => ({ titulo:'Comentário / texto adicional', texto:this._stripHtml(String(x)) })).filter(x => x.texto) : [],
                    apiCelebrations: [],
                    fromLocal: true
                };
            },

            // As funções de API permanecem somente para compatibilidade com versões anteriores.
            // O aplicativo não as usa para carregar a Liturgia: o banco local é a fonte principal.
            _readApiCache() {
                try { return JSON.parse(localStorage.getItem(this.API_CACHE_KEY) || '{}'); } catch { return {}; }
            },
            _writeApiCache(cache) {
                try { localStorage.setItem(this.API_CACHE_KEY, JSON.stringify(cache)); } catch {}
            },
            async getLiturgicalDayAsync(dateStr = getLocalDateString()) {
                const requested = getLocalDateString(new Date(dateStr + 'T12:00:00'));
                try {
                    return await this.fetchFromLocal(requested);
                } catch (error) {
                    console.warn('Falha ao carregar Liturgia local:', error);
                    return null;
                }
            },
            getDayInfo(dateStr = getLocalDateString()) {
                const date = String(dateStr);
                const d = new Date(date + 'T12:00:00');
                const weekday = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][d.getDay()];
                return {date, weekday, liturgicalSeason:'', celebration:'Liturgia do Dia', rank:'', liturgicalColor:'', pending:true};
            },
            getLiturgicalDay(dateStr = getLocalDateString()) {
                return this.getDayInfo(dateStr);
            }
        };

        const CatechismApiProvider = {
            releaseApi: 'https://api.github.com/repos/nossbigg/catechism-ccc-json/releases/latest',
            cacheKey: 'catecismo_api_cache_v1',
            state: { entries: null, status: 'idle', error: null, sourceUrl: null },
            async init() {
                if (this.state.status === 'ready') return this.state.entries || [];
                try {
                    const cached = JSON.parse(localStorage.getItem(this.cacheKey) || 'null');
                    if (cached?.entries?.length) { this.state.entries = cached.entries; this.state.sourceUrl = cached.sourceUrl || null; this.state.status = 'ready'; return this.state.entries; }
                } catch (_) {}
                this.state.status = 'loading';
                try {
                    const rel = await fetch(this.releaseApi, { headers: { Accept: 'application/vnd.github+json' } });
                    if (!rel.ok) throw new Error('Fonte gratuita indisponível (GitHub ' + rel.status + ').');
                    const data = await rel.json();
                    const asset = (data.assets || []).find(a => /\.json$/i.test(a.name));
                    if (!asset) throw new Error('Nenhum arquivo JSON foi encontrado na publicação.');
                    const r = await fetch(asset.browser_download_url);
                    if (!r.ok) throw new Error('JSON remoto indisponível (' + r.status + ').');
                    const payload = await r.json();
                    const arr = Array.isArray(payload) ? payload : (payload.paragraphs || payload.catechism || payload.data || payload.items || []);
                    const entries = Array.isArray(arr) ? arr.map((x,i) => {
                        if (typeof x === 'string') return { id:i+1, text:x };
                        return { id:Number(x.id ?? x.number ?? x.paragraph ?? x.paragraphNumber ?? i+1), text:String(x.text ?? x.content ?? x.body ?? x.paragraphText ?? '') };
                    }).filter(x => Number.isFinite(x.id) && x.text.trim()) : [];
                    if (!entries.length) throw new Error('O JSON remoto não contém parágrafos reconhecíveis.');
                    this.state.entries = entries; this.state.sourceUrl = asset.browser_download_url; this.state.status = 'ready';
                    try { localStorage.setItem(this.cacheKey, JSON.stringify({savedAt:Date.now(), entries, sourceUrl:this.state.sourceUrl})); } catch (_) {}
                    return entries;
                } catch (err) { this.state.status='error'; this.state.error=err?.message || 'Falha ao carregar o Catecismo.'; return []; }
            },
            parseReference(ref) { const n=String(ref||'').match(/\d+/g)?.map(Number)||[]; if(!n.length)return []; if(n.length===1)return[n[0]]; const[a,b]=n; return b>=a&&b-a<=40?Array.from({length:b-a+1},(_,i)=>a+i):n.slice(0,2); },
            async getReference(ref) { const e=await this.init(); const ids=this.parseReference(ref); return ids.map(id=>e.find(x=>x.id===id)).filter(Boolean); }
        };

        const CatecismContentProvider = {
            categories: [
                { id: "creio", title: "CREIO — A FÉ", subtitle: "O Credo Apostólico e a Revelação Divina", icon: "🛡️", description: "Estudo profundo da profissão de fé católica, da Sagrada Escritura e da Tradição bimilenar." },
                { id: "celebro", title: "CELEBRO — OS SACRAMENTOS", subtitle: "A Liturgia e os Sete Sacramentos", icon: "✨", description: "Como a obra da redenção é continuada através da sagrada liturgia e dos sete sacramentos instituídos por Cristo." },
                { id: "vivo", title: "VIVO — A VIDA EM CRISTO", subtitle: "A Moral Católica e os Mandamentos", icon: "🌿", description: "A vocação do homem em Cristo, a graça, as virtudes e a lei moral expressa nos Mandamentos e nas Bem-aventuranças." },
                { id: "rezo", title: "REZO — A ORAÇÃO CRISTÃ", subtitle: "A Vida de Orações e o Pai-Nosso", icon: "🕊️", description: "O dom da oração, a oração vocal, a meditação e a contemplação na vida do discípulo." }
            ],
            
            modules: [
                // CREIO (5 Aulas)
                { id: "creio_1", bibleRef: "Salmos 41 (42), 2", categoryId: "creio", title: "1. O desejo de Deus", ccc: "CCC § 27-30", description: "O homem traz inscrito no coração a ânsia pelo Criador.", explanation: "O desejo de Deus está inscrito no coração do homem, porque o homem foi criado por Deus e para Deus. Deus não cessa de atrair o homem a Si e só em Deus o homem encontrará a verdade e a felicidade que procura.", keyPoints: ["O homem traz a ânsia por Deus no íntimo.", "Deus atrai continuamente a criatura.", "A felicidade plena só se encontra no Criador."], reflection: "Em que momentos percebo que as coisas passageiras não preenchem meu coração?", questions: [{ q: "Por que o homem busca instintivamente a Deus?", a: "Porque foi criado por Ele e para Ele." }], quizQuestions: [{ q: "Onde está inscrito o desejo de Deus?", options: ["No coração do homem", "Nas pedras", "Nos astros"], correct: 0 }] },
                { id: "creio_2", bibleRef: "Hebreus 1, 1-2", categoryId: "creio", title: "2. A Revelação Divina", ccc: "CCC § 50-53", description: "Deus revela-Se a Si mesmo e manifesta o mistério da sua vontade.", explanation: "Apraz a Deus, na sua bondade e sabedoria, revelar-Se a Si mesmo e dar a conhecer o mistério da sua vontade: os homens, por meio de Cristo, Verbo feito carne, têm acesso ao Pai no Espírito Santo.", keyPoints: ["Deus toma a iniciativa de se revelar.", "A revelação atinge o cume em Jesus Cristo.", "Somos chamados à comunhão trinitária."], reflection: "Como acolho a Palavra de Deus em minha vida diária?", questions: [{ q: "Quem é a plenitude da Revelação?", a: "Jesus Cristo." }], quizQuestions: [{ q: "Qual é a plenitude da Revelação divina?", options: ["Jesus Cristo", "Os profetas", "A natureza"], correct: 0 }] },
                { id: "creio_3", bibleRef: "Hebreus 11, 1", categoryId: "creio", title: "3. A Fé: resposta do homem a Deus", ccc: "CCC § 142-143", description: "Pela fé, o homem submete plenamente sua inteligência e sua vontade a Deus.", explanation: "A fé é a resposta adequada do homem a Deus, que se revela. Significa entregar-se inteiramente a Ele, reconhecendo Sua verdade absoluta e confiando em Suas promessas, modelo que vemos perfeitamente em Abraão e na Virgem Maria.", keyPoints: ["A fé é um dom gratuito e uma virtude sobrenatural.", "Exige o assentimento da inteligência e da vontade.", "A fé sem obras é morta."], reflection: "Minha fé se traduz em confiança diária na providência de Deus?", questions: [{ q: "O que significa crer?", a: "Submeter livremente a inteligência e a vontade a Deus." }], quizQuestions: [{ q: "A fé cristã exige o consentimento de quê?", options: ["Inteligência e vontade", "Apenas das emoções", "Da cultura popular"], correct: 0 }] },
                { id: "creio_4", bibleRef: "2 Timóteo 3, 16-17", categoryId: "creio", title: "4. A Sagrada Escritura e a Tradição", ccc: "CCC § 80-84", description: "A transmissão da Revelação divina através da Igreja.", explanation: "A Sagrada Tradição e a Sagrada Escritura estão intimamente unidas e compenetradas entre si. Ambas dimanam da mesma fonte divina, formam um só tesouro da Palavra de Deus e são confiadas à Igreja para a salvação da humanidade.", keyPoints: ["Bíblia e Tradição formam um único depósito da fé.", "O Magistério tem a tarefa de interpretar autenticamente a Palavra.", "A Revelação encerrou-se com os apóstolos."], reflection: "Eu procuro ler a Bíblia junto com a sabedoria bimilenar da Igreja?", questions: [{ q: "Quais são os dois canais de transmissão da Revelação?", a: "A Sagrada Escritura e a Sagrada Tradição." }], quizQuestions: [{ q: "O que forma o único depósito da fé?", options: ["Sagrada Escritura e Sagrada Tradição", "Bíblia e a Ciência", "Opiniões teológicas"], correct: 0 }] },
                { id: "creio_5", bibleRef: "Mateus 28, 19", categoryId: "creio", title: "5. A Santíssima Trindade", ccc: "CCC § 232-234", description: "O mistério central da fé e da vida cristã.", explanation: "O mistério da Santíssima Trindade é o mistério central da fé e da vida cristã. É o mistério de Deus em Si mesmo. Os cristãos são batizados em nome do Pai e do Filho e do Espírito Santo: não em seus nomes, pois há um só Deus, o Pai Todo-Poderoso e seu Filho Único e o Espírito Santo.", keyPoints: ["Existe um só Deus em três Pessoas divinas.", "As três Pessoas são consubstanciais (possuem a mesma natureza divina).", "Toda a obra da salvação é obra comum das três Pessoas."], reflection: "Reconheço que ao fazer o Sinal da Cruz invoco a presença real do Deus Trino?", questions: [{ q: "O que é o mistério da Santíssima Trindade?", a: "É o mistério de um só Deus em três Pessoas divinas." }], quizQuestions: [{ q: "Quantos deuses os cristãos adoram?", options: ["Um só Deus", "Três Deuses", "Muitos deuses"], correct: 0 }] },

                // CELEBRO (5 Aulas)
                { id: "celebro_1", bibleRef: "Efésios 1, 3", categoryId: "celebro", title: "1. O que é a Liturgia", ccc: "CCC § 1066-1070", description: "A participação do Povo de Deus na obra de Deus.", explanation: "A Liturgia é o culto público oficial que a Igreja rende a Deus. Por meio da Liturgia, Cristo, nosso Redentor e Sumo Sacerdote, continua na Sua Igreja, com ela e por ela, a obra da nossa redenção.", keyPoints: ["É a obra de Cristo Sacerdote e do Seu Corpo, a Igreja.", "Na Liturgia celebra-se o mistério pascal de Cristo.", "É a fonte e o ápice da vida cristã."], reflection: "Participo da Liturgia como mero espectador ou ativamente como membro do Corpo de Cristo?", questions: [{ q: "O que é a Liturgia na Igreja Católica?", a: "O culto público que o Corpo Místico de Cristo (Cabeça e membros) presta a Deus." }], quizQuestions: [{ q: "A Liturgia é ação de quem?", options: ["De Cristo total (Cabeça e membros)", "Apenas do Sacerdote", "Do coral da Igreja"], correct: 0 }] },
                { id: "celebro_2", bibleRef: "Romanos 6, 3-4", categoryId: "celebro", title: "2. O Mistério Pascal", ccc: "CCC § 1084-1085", description: "A paixão, morte, ressurreição e glorificação de Jesus.", explanation: "O centro da liturgia é o mistério pascal: a paixão, morte, ressurreição e ascensão de Cristo, pela qual Ele destruiu nossa morte e restaurou a vida. Através dos sacramentos da Igreja, Cristo nos comunica as graças deste mistério redentor.", keyPoints: ["O mistério pascal é um evento real que não fica no passado.", "A liturgia torna presente a eficácia do sacrifício de Cristo.", "Toda a salvação nos vem através desta entrega total."], reflection: "Como eu deixo que a cruz e a ressurreição de Cristo transformem meus sofrimentos?", questions: [{ q: "O que se torna presente nos sacramentos?", a: "O mistério pascal de Cristo." }], quizQuestions: [{ q: "Qual é o centro de toda a vida litúrgica?", options: ["O Mistério Pascal de Cristo", "O Sermão da Montanha", "As Parábolas"], correct: 0 }] },
                { id: "celebro_3", bibleRef: "1 Coríntios 4, 1", categoryId: "celebro", title: "3. Os Sete Sacramentos", ccc: "CCC § 1210-1211", description: "Sinais sensíveis e eficazes da graça instituídos por Cristo.", explanation: "Os sacramentos são sinais sensíveis e eficazes da graça, instituídos por Cristo e confiados à Igreja, através dos quais nos é dada a vida divina.", keyPoints: ["Cristo instituiu exatamente sete sacramentos.", "Eles conferem a graça pela própria ação celebrada (ex opere operato).", "Eles edificam o Corpo místico de Cristo."], reflection: "Qual sacramento frequento com maior devoção e gratidão?", questions: [{ q: "Quantos são os sacramentos da Igreja?", a: "Sete." }], quizQuestions: [{ q: "Quantos são os sacramentos?", options: ["Sete", "Três", "Dez"], correct: 0 }] },
                { id: "celebro_4", bibleRef: "João 3, 5", categoryId: "celebro", title: "4. O Sacramento do Batismo", ccc: "CCC § 1213", description: "O fundamento de toda a vida cristã e a porta da vida no Espírito.", explanation: "O santo Batismo é o fundamento de toda a vida cristã, o pórtico da vida no Espírito e a porta que abre o acesso aos demais sacramentos. Pelo Batismo somos libertos do pecado e regenerados como filhos de Deus, tornando-nos membros de Cristo.", keyPoints: ["Apaga o pecado original e todos os pecados pessoais.", "Imprime na alma um selo espiritual indelével (caráter).", "Incorpora o fiel à Igreja."], reflection: "Eu lembro da data do meu Batismo? Renovo minhas promessas batismais?", questions: [{ q: "Qual o efeito principal do Batismo?", a: "A regeneração no Espírito Santo e o perdão dos pecados." }], quizQuestions: [{ q: "O Batismo apaga qual pecado?", options: ["O original e os atuais", "Apenas o pecado venial", "Nenhum pecado"], correct: 0 }] },
                { id: "celebro_5", bibleRef: "Lucas 22, 19-20", categoryId: "celebro", title: "5. A Santíssima Eucaristia", ccc: "CCC § 1324-1327", description: "A fonte e o ápice de toda a vida cristã.", explanation: "A Eucaristia é a fonte e o ápice de toda a vida cristã. Os demais sacramentos e obras de apostolado estão vinculados à Eucaristia e a ela se ordenam, pois na Eucaristia está contido todo o bem espiritual da Igreja: o próprio Cristo, nossa Páscoa.", keyPoints: ["Presença real, verdadeira e substancial de Cristo (Transubstanciação).", "É o mesmo sacrifício da Cruz atualizado no altar.", "A comunhão aumenta a união do fiel com o Senhor."], reflection: "Preparo meu coração dignamente (estado de graça) antes de comungar?", questions: [{ q: "O que é a Transubstanciação?", a: "A conversão de toda a substância do pão e do vinho no Corpo e Sangue de Cristo." }], quizQuestions: [{ q: "Qual sacramento é o 'ápice' da vida cristã?", options: ["A Eucaristia", "O Matrimônio", "O Batismo"], correct: 0 }] },

                // VIVO (5 Aulas)
                { id: "vivo_1", bibleRef: "Gênesis 1, 26-27", categoryId: "vivo", title: "1. A Dignidade da Pessoa Humana", ccc: "CCC § 1700-1709", description: "Criado à imagem e semelhança de Deus.", explanation: "A dignidade da pessoa humana tem suas raízes na criação à imagem e semelhança de Deus; ela atinge sua plenitude na vocação divina à comunhão com o Criador.", keyPoints: ["Imagem e semelhança divina dão ao homem um valor incalculável.", "Todo ser humano é dotado de liberdade e inteligência.", "Somos chamados à bem-aventurança eterna."], reflection: "Reconheço a dignidade divina em cada pessoa com quem convivo?", questions: [{ q: "Qual é a raiz da dignidade humana?", a: "A criação à imagem e semelhança de Deus." }], quizQuestions: [{ q: "A dignidade humana fundamenta-se em quê?", options: ["Na criação à imagem de Deus", "Na riqueza material", "Nas leis dos homens"], correct: 0 }] },
                { id: "vivo_2", bibleRef: "Gálatas 5, 13", categoryId: "vivo", title: "2. Liberdade e Responsabilidade", ccc: "CCC § 1730-1734", description: "A liberdade é o poder de agir ou não agir, tendo a responsabilidade pelos próprios atos.", explanation: "Deus criou o homem racional e conferiu-lhe a dignidade de uma pessoa dotada de iniciativa e de domínio de seus atos. A liberdade não é fazer o que apetece, mas o poder radicado na razão e na vontade de fazer o bem.", keyPoints: ["Quanto mais faz o bem, mais o homem se torna livre.", "A liberdade humana é limitada e falível.", "Todo ato livre é imputável ao seu autor (responsabilidade)."], reflection: "Tenho usado minha liberdade para amar a Deus e servir ao próximo?", questions: [{ q: "O que torna um homem verdadeiramente livre?", a: "A escolha habitual do bem e a adesão à verdade." }], quizQuestions: [{ q: "A verdadeira liberdade cristã consiste em:", options: ["Poder escolher o bem e a verdade", "Fazer qualquer coisa sem limite", "Fugir das responsabilidades"], correct: 0 }] },

        function formatLiturgicalText(value) {
            let text = String(value ?? '');
            // Algumas fontes entregam os números dos versículos colados ao texto: "3Mas", "4Quanto".
            // Normalizamos apenas padrões típicos de início de versículo, sem reescrever o conteúdo.
            text = text
                .replace(/(^|\s)(\d{1,3})[oº]\s+/gm, '$1\n$2 ')
                .replace(/(^|\s)(\d{1,3})(?=[A-ZÁÉÍÓÚÂÊÔÃÕÀÇ])/gm, '$1\n$2 ');
            return text.replace(/\n{3,}/g, '\n\n').trim();
        }

            normalizeDate(dateStr) {
                return /^\d{4}-\d{2}-\d{2}$/.test(String(dateStr || '')) ? String(dateStr) : getLocalDateString();

            normalizeName(value) {
                return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/^(santa|santo|beato|beata|nossa senhora)\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();
            },
            parseSourceText(fullText) {
                const text = String(fullText || '').replace(/\r/g,'').trim();
                if (!text) return [];
                const lines = text.split('\n').map(x => x.trim()).filter(Boolean);
                const known = ['Origens','A Natividade','A Tradição','Relevância da Festividade','O Exemplo é Maria','A Celebração','Protetora e Padroeira','Protetor e Padroeiro','Minha oração','Outros santos e beatos celebrados em'];
                const sections = [];
                let current = null;
                for (const line of lines) {
                    const heading = known.some(h => line === h || line.startsWith(h));
                    if (heading) { current = {title:line, paragraphs:[]}; sections.push(current); }
                    else { if (!current) { current={title:'',paragraphs:[]}; sections.push(current); } current.paragraphs.push(line); }
                }
                return sections.filter(s => s.paragraphs.length || s.title);
            },
            extractSectionText(sections, matcher) {
                const sec = (sections || []).find(s => matcher.test(String(s.title || '')));
                return sec ? sec.paragraphs.join(' ').trim() : '';
            },
            async fetchSaintToday() {
                const url = 'https://api-liturgia-diaria.vercel.app/santo-do-dia';
                const payload = await (async () => {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 10000);
                    try {
                        const r = await fetch(url,{headers:{Accept:'application/json'},cache:'no-store',signal:controller.signal});
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return await r.json();
                    } finally { clearTimeout(timer); }
                })();
                const item = payload?.today || payload;
                if (!item || typeof item !== 'object') return null;
                const requested = getLocalDateString();
                const monthMap = {jan:1,janeiro:1,fev:2,fevereiro:2,mar:3,marco:3,'março':3,abr:4,abril:4,mai:5,maio:5,jun:6,junho:6,jul:7,julho:7,ago:8,agosto:8,set:9,setembro:9,out:10,outubro:10,nov:11,novembro:11,dez:12,dezembro:12};
                const returned = `${Number(item.year||0)}-${String(monthMap[String(item.month||'').toLowerCase()]||Number(item.month||0)).padStart(2,'0')}-${String(Number(item.day||0)).padStart(2,'0')}`;
                if (returned !== requested) return null;
                const title = String(item.title || '').trim();
                const fullText = String(item.full_text || '').replace(/\r/g,'').trim();
                const sections = this.parseSourceText(fullText);
                const name = title.split(',')[0].trim() || title || 'Celebração do dia';
                return {
                    id:'api_' + this.normalizeName(name).replace(/[^a-z0-9]+/g,'_'),

                    biography:fullText,
                    prayer:this.extractSectionText(sections,/^Minha oração$/i),
                    patronage:this.extractSectionText(sections,/^Protetora e Padroeira$|^Protetor e Padroeiro$/i),
                    source:url,sourceName:String(payload?.source || 'Canção Nova'),
                    otherSaints:Array.isArray(item.outros_santos) ? item.outros_santos.filter(Boolean) : [],
                    dateValidated:true, returnedDate:requested, api:true

            findLocalByName(name) {
                const target = this.normalizeName(name);
                if (!target) return null;
                const all = [...this.saints, ...Object.values(this.localExtras || {})];

                merged.biography = r.biography || r.summary || b.biography || '';

        const LocalSaintDataProvider = {

            async getByDate(dateStr) {
                const date = String(dateStr || '');
                if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
                if (this.cache.has(date)) return this.cache.get(date);
                const url = `${this.baseUrl}${date.slice(0,4)}/${date}.json`;
                try {
                    const response = await fetch(url, { cache: 'no-store' });
                    if (!response.ok) throw new Error(`Santos locais indisponíveis (${response.status})`);
                    const data = await response.json();
                    if (!data || data.date !== date || !Array.isArray(data.saints)) throw new Error('Registro local de santos inválido.');
                    this.cache.set(date, data);

        const SaintContextProvider = {

            },
            looksLikeSaintCelebration(text) {

            findSaintMentionInLiturgy(lit) {
                const candidates = [lit?.celebration, ...(Array.isArray(lit?.apiCelebrations) ? lit.apiCelebrations.map(c => c?.liturgia) : []), ...(lit?.extras || [])].filter(Boolean);
                const localAll = [...SaintContentProvider.saints, ...Object.values(SaintContentProvider.localExtras || {})];
                for (const candidate of candidates) {
                    const cn = this.normalize(candidate);
                    if (!this.looksLikeSaintCelebration(candidate)) continue;
                    const found = localAll.find(s => { const sn=this.normalize(s?.name); return sn && (cn.includes(sn) || sn.includes(cn)); });

                    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + duration);
                } catch (e) {
                    console.warn('Audio feedback indisponível:', e);
                }
            },

            playCorrect() {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    // Tríade brilhante ascendente: C5 (523Hz), E5 (659Hz), G5 (784Hz)
                    this.playTone(523.25, 'sine', 0.22, now, 0.18);
                    this.playTone(659.25, 'sine', 0.24, now + 0.08, 0.18);
                    this.playTone(783.99, 'sine', 0.35, now + 0.16, 0.22);
                } catch(e) {}
            },

            playWrong() {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    // Tom suave descendente instrutivo (não estridente): F4 (349Hz) -> C#4 (277Hz)
                    this.playTone(349.23, 'triangle', 0.25, now, 0.22);
                    this.playTone(277.18, 'triangle', 0.35, now + 0.12, 0.22);
                } catch(e) {}
            },

            playVictory() {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    // Fanfarra alegre triunfante: C5, E5, G5, C6 (1046Hz)
                    this.playTone(523.25, 'sine', 0.25, now, 0.20);
                    this.playTone(659.25, 'sine', 0.25, now + 0.10, 0.20);
                    this.playTone(783.99, 'sine', 0.30, now + 0.20, 0.22);
                    this.playTone(1046.50, 'sine', 0.60, now + 0.32, 0.25);
                } catch(e) {}
            }
        };

            router.navigate('liturgia', getLocalDateString());

        function markLiturgicalRead(date) {
            if (AppState.liturgicalRead[date]) {
                showToast("Esta liturgia já foi lida!", "info");
                return;
            }
            AppState.liturgicalRead[date] = true;
            AppState.xp += 15;

                AppState.unlockedAchievements.push('first_liturgy');
                showToast("🏆 Conquista: Ouvinte da Palavra!", "success");

            const textarea = document.getElementById('lectio-user-notes');

            if (!AppState.lectioNotes) AppState.lectioNotes = {};
            AppState.lectioNotes[date] = textarea.value.trim();
            saveState();

            if (ind) {

        function markPrayerDone() {
            const today = getLocalDateString();
            if (AppState.lastPrayerDate === today) {
                showToast("Você já concluiu a oração de hoje.", "info");
                return;
            }
            const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            const yStr = getLocalDateString(yesterday);
            AppState.streak = (AppState.lastPrayerDate === yStr) ? AppState.streak + 1 : 1;
            AppState.lastPrayerDate = today;
            AppState.xp += 10;
            saveState();
            showToast(`Momento de oração concluído! +10 XP • Ofensiva: ${AppState.streak} dia(s)`, "success");

        async function loadBibleChapter(bookCode, chapter, targetMain = null) {
            const book = BibleProvider.getBook(bookCode); if (!book) return;
            const ch = Math.max(1, Math.min(Number(chapter)||1, book.chapters));
            if (router.currentRoute !== 'biblia' && !targetMain) router.navigate('biblia', bookCode + ':' + ch);
            const area = document.getElementById('bible-content');
            if (!area) return;
            area.innerHTML = `<div class="py-16 text-center"><div class="inline-flex items-center gap-2 px-4 py-2 bg-slate-50 rounded-xl text-xs font-semibold text-slate-500">📖 Carregando ${book.name} ${ch}…</div></div>`;
            try {
                const data = await BibleProvider.fetchChapter(bookCode, ch);
                if (router.currentRoute !== 'biblia') return;
                document.getElementById('bible-book').value = bookCode;
                document.getElementById('bible-chapter').value = ch;
                document.getElementById('bible-chapter').max = book.chapters;
                area.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-slate-100 pb-5">
                        <div><span class="text-[10px] font-bold text-dourado uppercase tracking-wider">${data.version}</span><h3 class="font-serif text-3xl font-bold text-mariana mt-1">${book.name} ${ch}</h3><p class="text-xs text-slate-500 mt-1">${data.verses.length} versículos neste capítulo</p></div>
                        <div class="flex gap-2"><button onclick="loadBibleChapter('${bookCode}', ${ch-1})" ${ch<=1?'disabled':''} class="px-3 py-2 bg-slate-100 rounded-xl text-xs font-bold disabled:opacity-40">← Anterior</button><button onclick="loadBibleChapter('${bookCode}', ${ch+1})" ${ch>=book.chapters?'disabled':''} class="px-3 py-2 bg-slate-100 rounded-xl text-xs font-bold disabled:opacity-40">Próximo →</button></div>
                    </div>
                    <div class="mt-6 space-y-4">${data.verses.map(v=>`<div id="biblia-${bookCode}-${ch}-${v.verse}" class="group rounded-2xl px-4 py-3 hover:bg-amber-50/60 transition"><span class="inline-flex w-8 h-8 items-center justify-center rounded-lg bg-slate-100 group-hover:bg-amber-100 text-[11px] font-bold text-mariana mr-2 align-top">${v.verse}</span><span class="text-sm leading-8 text-slate-700 bible-verse-text">${BibleProvider.escapeText(v.text)}</span></div>`).join('')}</div>
                    <div class="mt-8 pt-5 border-t border-slate-100 text-[10px] text-slate-400">Fonte dos dados: <a href="${BibleProvider.sourceUrl}" target="_blank" rel="noopener noreferrer" class="underline">Dancrf/biblia-db — Matos Soares (1956)</a></div>
                `;
                try { document.getElementById(`biblia-${bookCode}-${ch}-${1}`).scrollIntoView({block:'start'}); } catch(_) {}
            } catch (e) {
                area.innerHTML = `<div class="p-8 text-center"><span class="text-4xl">⚠️</span><p class="text-sm font-bold text-mariana mt-3">Não foi possível carregar ${book.name} ${ch}</p><p class="text-xs text-slate-500 mt-2">${BibleProvider.escapeText(e.message)}</p><button onclick="loadBibleChapter('${bookCode}',${ch})" class="mt-4 px-4 py-2 mariana-gradient text-white rounded-xl text-xs font-bold">Tentar novamente</button></div>`;
            }
        }

        async function openScriptureReferenceFromText(encodedReference) {
            const value = decodeURIComponent(String(encodedReference || ''));
            if (!value) return;
            const result = await BibleProvider.searchReference(value);
            if (!result) {
                showToast('Não consegui converter esta referência para a Bíblia. Abra a Bíblia para pesquisar manualmente.', 'info');
                router.navigate('biblia');
                return;
            }
            router.navigate('biblia', result.data.bookCode + ':' + result.data.chapter);
            setTimeout(() => {
                const el = document.getElementById(`biblia-${result.data.bookCode}-${result.data.chapter}-${result.verse || 1}`);
                if (el) { el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('bg-amber-100'); setTimeout(()=>el.classList.remove('bg-amber-100'),2500); }
            }, 350);
        }

        function navigateSaintDay(currentDate, delta) {
            const d = new Date(currentDate + 'T12:00:00');
            d.setDate(d.getDate() + Number(delta || 0));
            router.navigate('santo', getLocalDateString(d));
        }

        async function openBibleReference() {
            const input=document.getElementById('bible-reference'); const value=input?.value?.trim(); if(!value) return;
            const result=await BibleProvider.searchReference(value);
            if(!result){ showToast('Referência não reconhecida. Use algo como Jo 3,16 ou Eclo 24,1.', 'info'); return; }
            router.navigate('biblia', result.data.bookCode + ':' + result.data.chapter);
            setTimeout(()=>{
                const el=document.getElementById(`biblia-${result.data.bookCode}-${result.data.chapter}-${result.verse||1}`);
                if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('bg-amber-100'); setTimeout(()=>el.classList.remove('bg-amber-100'),2500); }

        function activatePlan(planId) {

        /* ---- Quiz engine ---- */
        let QuizSession = null;

        function startQuiz(category = null, limit = 5) {
            QuizAudio.init();
            let pool = category ? QuizContentProvider.questions.filter(q => q.category === category) : [...QuizContentProvider.questions];
            pool = pool.sort(() => Math.random() - 0.5).slice(0, limit);
            QuizSession = { questions: pool, index: 0, correct: 0, answered: false, category, limit };
            renderQuizQuestion();
            const area = document.getElementById('quiz-area');
            if (area) area.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderQuizQuestion() {
            const area = document.getElementById('quiz-area');
            if (!area || !QuizSession) return;
            const s = QuizSession;
            if (s.index >= s.questions.length) {
                const pct = Math.round((s.correct / s.questions.length) * 100);
                const xp = s.correct * 10;
                AppState.xp += xp;
                AppState.completedQuizzes.push(Date.now());
                if (pct >= 80) {
                    QuizAudio.playVictory();
                    if (!AppState.unlockedAchievements.includes('quiz_master')) {
                        AppState.unlockedAchievements.push('quiz_master');
                        showToast("🏆 Conquista Desbloqueada: Mente Iluminada!", "success");
                    }
                }
                saveState();
                area.innerHTML = `
                    <div class="bg-white rounded-3xl p-8 border border-slate-200 card-shadow text-center space-y-5 animate-fadeIn">
                        <div class="relative inline-block">
                            <span class="text-6xl">${pct >= 80 ? '🏆' : pct >= 50 ? '🎉' : '📖'}</span>
                            ${pct >= 80 ? '<div class="absolute -top-2 -right-2 text-2xl animate-bounce">✨</div>' : ''}
                        </div>
                        <div>
                            <h3 class="font-serif text-2xl md:text-3xl font-bold text-mariana">${pct >= 80 ? 'Excelente Desempenho!' : pct >= 50 ? 'Bom Estudo!' : 'Continue Perseverando!'}</h3>
                            <p class="text-sm text-slate-600 mt-1">Você acertou <strong>${s.correct} de ${s.questions.length}</strong> (${pct}%) e conquistou <strong>+${xp} XP</strong>.</p>
                        </div>
                        <div class="w-full max-w-xs mx-auto bg-slate-100 h-3 rounded-full overflow-hidden">
                            <div class="${pct >= 80 ? 'bg-emerald-500' : pct >= 50 ? 'gold-gradient' : 'bg-amber-400'} h-full rounded-full transition-all duration-700" style="width: ${pct}%"></div>
                        </div>
                        <div class="flex flex-wrap gap-3 justify-center pt-3">
                            <button onclick="startQuiz('${s.category || ''}', ${s.limit || 5})" class="px-6 py-3.5 mariana-gradient text-white rounded-xl text-xs font-bold transition hover:scale-105 shadow-md flex items-center gap-2">
                                <span>🎲</span> Jogar Novamente
                            </button>
                            <button onclick="router.navigate('catecismo')" class="px-6 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
                                📜 Estudar o Catecismo
                            </button>
                            <button onclick="router.navigate('biblia')" class="px-6 py-3.5 bg-blue-50 hover:bg-blue-100 text-blue-900 border border-blue-200 rounded-xl text-xs font-bold transition">
                                📖 Abrir a Bíblia
                            </button>
                        </div>
                    </div>
                `;
                QuizSession = null;
                return;
            }
            const q = s.questions[s.index];
            area.innerHTML = `
                <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-200 card-shadow space-y-5 animate-fadeIn">
                    <div class="flex items-center justify-between text-xs font-bold text-slate-500">
                        <span class="text-mariana font-bold">Pergunta ${s.index + 1} de ${s.questions.length}</span>
                        <span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg border border-slate-200/60">${q.category} • ${q.difficulty}</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                        <div class="gold-gradient h-full rounded-full transition-all duration-300" style="width: ${(s.index / s.questions.length) * 100}%"></div>
                    </div>
                    <h3 class="font-serif text-xl md:text-2xl font-bold text-mariana leading-snug">${q.question}</h3>
                    <div class="space-y-3" id="quiz-options">
                        ${q.options.map((opt, i) => `
                            <button onclick="answerQuiz(${i})" data-idx="${i}" class="quiz-opt w-full p-4 text-left rounded-2xl border border-slate-200 bg-slate-50 hover:border-mariana hover:bg-blue-50/60 text-sm font-semibold text-slate-700 transition transform hover:-translate-y-0.5 shadow-sm">
                                <span class="inline-block w-6 h-6 rounded-full bg-white border border-slate-300 text-slate-600 text-center text-xs font-bold mr-2 leading-5">${String.fromCharCode(65 + i)}</span>
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div id="quiz-feedback"></div>
                </div>
            `;
        }

        function answerQuiz(idx) {
            const s = QuizSession;
            if (!s || s.answered) return;
            s.answered = true;
            const q = s.questions[s.index];
            const isCorrect = idx === q.correctAnswer;
            if (isCorrect) {
                s.correct++;
                QuizAudio.playCorrect();
            } else {
                QuizAudio.playWrong();
            }

            document.querySelectorAll('.quiz-opt').forEach(btn => {
                const i = parseInt(btn.dataset.idx);
                btn.disabled = true;
                btn.classList.remove('hover:-translate-y-0.5', 'hover:border-mariana', 'hover:bg-blue-50/60');
                if (i === q.correctAnswer) {
                    btn.className = 'quiz-opt w-full p-4 text-left rounded-2xl border-2 border-emerald-500 bg-emerald-50 text-sm font-bold text-emerald-950 transition shadow-sm flex items-center justify-between';
                    btn.innerHTML += '<span class="text-emerald-600 font-bold text-base">✓ Correto</span>';
                } else if (i === idx) {
                    btn.className = 'quiz-opt w-full p-4 text-left rounded-2xl border-2 border-rose-400 bg-rose-50 text-sm font-semibold text-rose-900 transition flex items-center justify-between';
                    btn.innerHTML += '<span class="text-rose-500 font-bold text-base">✗ Sua escolha</span>';
                } else {
                    btn.className = 'quiz-opt w-full p-4 text-left rounded-2xl border border-slate-200 bg-slate-50/60 text-sm text-slate-400 transition opacity-60';
                }
            });

            document.getElementById('quiz-feedback').innerHTML = `
                <div class="p-5 rounded-2xl ${isCorrect ? 'bg-emerald-50/80 border border-emerald-200' : 'bg-rose-50/80 border border-rose-200'} space-y-3 mt-4 animate-fadeIn">
                    <div class="flex items-center gap-2">
                        <span class="text-lg">${isCorrect ? '✅' : '❌'}</span>
                        <p class="text-sm font-bold ${isCorrect ? 'text-emerald-900' : 'text-rose-900'}">${isCorrect ? 'Resposta Exata! (+10 XP)' : 'Resposta Incorreta.'}</p>
                    </div>
                    <p class="text-xs text-slate-700 leading-relaxed bg-white/70 p-3 rounded-xl border border-slate-100 font-medium">${q.explanation}</p>
                    <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                        <span class="text-[10px] font-bold text-mariana bg-amber-100/70 border border-amber-200 px-2.5 py-1 rounded-md">${q.ccc}</span>
                        ${q.bibleRef ? `<button onclick="openScriptureReferenceFromText('${encodeURIComponent(q.bibleRef)}')" class="text-[10px] font-bold text-blue-800 bg-blue-50 hover:bg-blue-100 border border-blue-200 px-3 py-1 rounded-md transition flex items-center gap-1 shadow-sm">📖 Iluminar na Bíblia: <strong>${q.bibleRef}</strong> →</button>` : ''}
                    </div>
                </div>
                <button onclick="nextQuizQuestion()" class="w-full py-3.5 mariana-gradient text-white rounded-xl text-xs font-bold transition hover:scale-105 mt-4 shadow-md flex items-center justify-center gap-2">
                    <span>${s.index + 1 >= s.questions.length ? '🏆 Ver Resultado Final' : 'Próxima Pergunta →'}</span>
                </button>
            `;
        }

        function nextQuizQuestion() {
            if (!QuizSession) return;
            QuizSession.index++;
            QuizSession.answered = false;
            renderQuizQuestion();
        }

        function completeLesson(id) {
            if (!AppState.completedLessons.includes(id)) {
                AppState.completedLessons.push(id);
                AppState.xp += 25;
                if (AppState.activeStudyPlan) {
                    if (!AppState.planProgress[AppState.activeStudyPlan]) AppState.planProgress[AppState.activeStudyPlan] = [];
                    if (!AppState.planProgress[AppState.activeStudyPlan].includes(id)) {
                        AppState.planProgress[AppState.activeStudyPlan].push(id);
                    }
                }
                saveState();
                showToast("Parabéns! Aula concluída. +25 XP", "success");
            } else {
                showToast("Você já havia concluído este módulo.", "info");
            }
            closeModal();
            if (router.currentRoute === 'catecismo') router.navigate('catecismo');
            if (router.currentRoute === 'planos') router.navigate('planos');
            if (router.currentRoute === 'progresso') router.navigate('progresso');
            if (router.currentRoute === 'home') router.navigate('home');
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function handleSearch(query) {
            if (!query || query.length < 2) return;
            router.navigate('pesquisa');
            setTimeout(() => {
                const input = document.getElementById('search-box-input');
                if (input) { input.value = query; executeSearch(query); }
            }, 50);
        }

        function executeSearch(query) {
            const container = document.getElementById('search-results-container');
            if (!query || query.length < 2) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Digite acima para pesquisar.</p>`;
                return;
            }

            const q = query.toLowerCase();
            const matchedModules = CatecismContentProvider.modules.filter(m => 
                m.title.toLowerCase().includes(q) || 
                m.description.toLowerCase().includes(q) || 
                m.explanation.toLowerCase().includes(q) ||
                m.ccc.toLowerCase().includes(q)
            );

            let html = '';
            if (matchedModules.length > 0) {
                html += `<h4 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Catecismo da Igreja Católica (${matchedModules.length})</h4>`;
                matchedModules.forEach(m => {
                    html += `
                        <div onclick="openLessonModal('${m.id}')" class="p-4 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition mb-2 shadow-sm">
                            <span class="text-[10px] text-amber-600 font-bold block mb-1">${m.ccc}</span>
                            <span class="text-sm font-bold text-mariana">${m.title}</span>
                            <p class="text-xs text-slate-500 mt-1 line-clamp-1">${m.description}</p>
                        </div>
                    `;
                });
            }

            if (!html) html = `<p class="text-xs text-slate-400 text-center py-6">Nenhum resultado encontrado para "${query}".</p>`;
            container.innerHTML = html;
        }

        window.onload = function() {
            loadState();
            router.navigate('home');
        };
    </script>
</body>
</html>
